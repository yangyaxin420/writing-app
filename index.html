<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔间</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c4a882">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="写页面">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ===== Variables / Themes ===== */
:root {
  --bg: #f8f6f3;
  --surface: #ffffff;
  --surface-alt: #f4f1ec;
  --border: #e8e4de;
  --border-light: #f0ede8;
  --text: #1d1d1f;
  --text-secondary: #8e8e93;
  --text-tertiary: #bbb7b0;
  --accent: #c4a882;
  --accent-hover: #b89b72;
  --accent-light: #f0e8de;
  --shadow: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.08);
  --radius: 10px;
  --radius-sm: 6px;
  --transition: 0.2s ease;
}

/* Theme: 晴空 */
[data-theme="sky"] {
  --bg: #f0f8ff;
  --surface: #ffffff;
  --surface-alt: #e6f3fa;
  --border: #d0e4f0;
  --border-light: #e6f3fa;
  --text-secondary: #7a9eb5;
  --text-tertiary: #a8c4d8;
  --accent: #bae6fb;
  --accent-hover: #7dd3fc;
  --accent-light: #e0f2fe;
}
/* Theme: 薄荷 */
[data-theme="mint"] {
  --bg: #f0fdf4;
  --surface: #ffffff;
  --surface-alt: #e6f5ea;
  --border: #c8e0d0;
  --border-light: #e0f0e4;
  --text-secondary: #78a088;
  --text-tertiary: #a0c0ac;
  --accent: #86cfa3;
  --accent-hover: #5cb87a;
  --accent-light: #dcfce7;
}
/* Theme: 奶油 */
[data-theme="cream"] {
  --bg: #fefceb;
  --surface: #ffffff;
  --surface-alt: #f8f3d8;
  --border: #e8e2c8;
  --border-light: #f2ecd0;
  --text-secondary: #a09870;
  --text-tertiary: #c0b898;
  --accent: #fde68a;
  --accent-hover: #fcd34d;
  --accent-light: #fef9c3;
}
/* Theme: 纯白 */
[data-theme="white"] {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-alt: #f0f0f0;
  --border: #e0e0e0;
  --border-light: #f0f0f0;
  --text-secondary: #9e9e9e;
  --text-tertiary: #c0c0c0;
  --accent: #d0d0d0;
  --accent-hover: #b0b0b0;
  --accent-light: #f0f0f0;
}

/* Theme: 暮色 (柔和暗色) */
[data-theme="dusk"] {
  --bg: #3a3835;
  --surface: #454240;
  --surface-alt: #4e4b48;
  --border: #5a5754;
  --border-light: #4e4b48;
  --text: #e0ddda;
  --text-secondary: #a8a5a0;
  --text-tertiary: #807d78;
  --accent: #c4a882;
  --accent-hover: #d4b892;
  --accent-light: #4a4540;
  --shadow: 0 1px 3px rgba(0,0,0,0.15);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.25);
}
/* Theme: 夜蓝 (柔和暗色) */
[data-theme="navy"] {
  --bg: #2d3748;
  --surface: #3a4556;
  --surface-alt: #434e5e;
  --border: #4e5968;
  --border-light: #434e5e;
  --text: #e2e8f0;
  --text-secondary: #a0aec0;
  --text-tertiary: #7a8898;
  --accent: #7dd3fc;
  --accent-hover: #38bdf8;
  --accent-light: #3a4860;
  --shadow: 0 1px 3px rgba(0,0,0,0.15);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.25);
}
/* Theme: 雾灰 (柔和暗色) */
[data-theme="charcoal"] {
  --bg: #2a2a2a;
  --surface: #363636;
  --surface-alt: #404040;
  --border: #4a4a4a;
  --border-light: #404040;
  --text: #e0e0e0;
  --text-secondary: #9e9e9e;
  --text-tertiary: #787878;
  --accent: #b0b0b0;
  --accent-hover: #cccccc;
  --accent-light: #3a3a3a;
  --shadow: 0 1px 3px rgba(0,0,0,0.15);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.25);
}

/* ===== Typography ===== */
h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 0.95rem; font-weight: 500; color: var(--text-secondary); }
a { color: inherit; text-decoration: none; }

/* ===== Layout ===== */
#app { max-width: 720px; margin: 0 auto; padding: 0 20px; min-height: 100vh; }

/* ===== Header ===== */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
}
header .back {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.9rem; color: var(--text-secondary); cursor: pointer;
  background: none; border: none; padding: 4px 0;
  transition: color var(--transition);
}
header .back:hover { color: var(--text); }
header .title { font-size: 1.15rem; font-weight: 600; }
header .actions { display: flex; gap: 12px; align-items: center; }

/* ===== Pages ===== */
.page { display: none; animation: fadeIn 0.25s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ===== Stats Bar (compact) ===== */
.stats-bar {
  display: flex; gap: 4px; margin-bottom: 16px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 10px 6px;
  justify-content: space-around;
}
.stat-item {
  text-align: center; cursor: pointer; transition: all var(--transition);
  padding: 2px 8px; border-radius: 4px; flex: 1;
}
.stat-item:hover { background: var(--surface-alt); }
.stat-item .si-value { font-size: 1.1rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.3; }
.stat-item .si-label { font-size: 0.68rem; color: var(--text-secondary); letter-spacing: 0.02em; }

/* ===== Theme Switcher Dots ===== */
.theme-dots { display: flex; gap: 5px; align-items: center; }
.theme-dot {
  width: 14px; height: 14px; border-radius: 50%; cursor: pointer;
  border: 1.5px solid var(--border); transition: all var(--transition);
  flex-shrink: 0;
}
.theme-dot:hover { transform: scale(1.25); }
.theme-dot.active { border-color: var(--text); box-shadow: 0 0 0 1.5px var(--text); }

/* ===== Section Header ===== */
.section-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px; padding-top: 4px;
}
.section-header h2 { font-size: 1rem; color: var(--text-secondary); font-weight: 500; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: var(--radius-sm);
  font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none;
  transition: all var(--transition); background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
}
.btn:hover { border-color: var(--accent); background: var(--accent-light); }
.btn-primary {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-sm { padding: 5px 12px; font-size: 0.82rem; }
.btn-ghost { background: transparent; border-color: transparent; padding: 6px 10px; }
.btn-ghost:hover { background: var(--surface-alt); border-color: var(--border); }
.btn-danger { color: #c44; border-color: #f0d8d8; }
.btn-danger:hover { background: #fdf0f0; border-color: #c44; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

/* ===== Quick Actions ===== */
.quick-actions { display: flex; gap: 8px; margin-bottom: 24px; }
.quick-actions .btn { flex: 1; justify-content: center; padding: 8px 12px; font-size: 0.82rem; }

/* ===== Recent List ===== */
.recent-list { margin-bottom: 32px; }
.recent-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-radius: var(--radius-sm);
  cursor: pointer; transition: background var(--transition);
  border-bottom: 1px solid var(--border-light);
}
.recent-item:last-child { border-bottom: none; }
.recent-item:hover { background: var(--surface-alt); }
.recent-item .ri-title { font-size: 0.93rem; font-weight: 500; }
.recent-item .ri-meta { font-size: 0.78rem; color: var(--text-tertiary); }

/* ===== Cards Grid ===== */
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 14px; cursor: pointer; transition: all var(--transition); position: relative;
}
.card:hover { box-shadow: var(--shadow-hover); border-color: var(--accent); }
.card .card-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
.card .card-type {
  font-size: 0.72rem; color: var(--accent);
}
.card .card-meta { font-size: 0.75rem; color: var(--text-tertiary); }
.card .card-excerpt { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.5; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
.card .card-footer {
  display: flex; align-items: center; gap: 8px; margin-top: 4px;
  font-size: 0.75rem; color: var(--text-tertiary);
}
.card .card-footer .cf-divider { color: var(--text-tertiary); opacity: 0.3; }
.card .card-delete {
  position: absolute; top: 10px; right: 12px;
  font-size: 0.75rem; color: var(--text-tertiary); cursor: pointer;
  background: none; border: none; padding: 2px 6px; border-radius: 4px;
  opacity: 0; transition: opacity var(--transition);
}
.card:hover .card-delete { opacity: 1; }
.card .card-delete:hover { color: #c44; background: #fdf0f0; }
.card-grid.single { grid-template-columns: 1fr; }

/* ===== Editor ===== */
.editor-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
}
.editor-title-input {
  font-size: 1.2rem; font-weight: 600; border: none; background: transparent;
  padding: 4px 0; outline: none; flex: 1; min-width: 120px;
  border-bottom: 2px solid transparent; transition: border-color var(--transition);
  font-family: inherit;
}
.editor-title-input:focus { border-bottom-color: var(--accent); }
.editor-save-status { font-size: 0.78rem; color: var(--text-tertiary); white-space: nowrap; }

.editor-toolbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.editor-toolbar .tool-group { display: flex; align-items: center; gap: 8px; }
.editor-toolbar .tool-label { font-size: 0.78rem; color: var(--text-secondary); }
.editor-toolbar .tool-value { font-size: 0.85rem; font-weight: 500; color: var(--text); min-width: 24px; text-align: center; }

/* Font size slider */
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 80px; height: 3px;
  background: var(--border); border-radius: 2px; outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
  background: var(--accent); border-radius: 50%; cursor: pointer;
  transition: transform var(--transition);
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; background: var(--accent); border-radius: 50%; border: none; cursor: pointer;
}

.editor-timer {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.85rem; color: var(--text-secondary); font-variant-numeric: tabular-nums;
}
.editor-timer .timer-icon { font-size: 0.8rem; }
.editor-wordcount { font-size: 0.85rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

.editor-textarea {
  width: 100%; min-height: calc(100vh - 320px); padding: 20px;
  font-size: 16px; line-height: 1.9;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text); resize: vertical;
  outline: none; font-family: inherit;
  transition: border-color var(--transition);
}
.editor-textarea:focus { border-color: var(--accent); }
.editor-textarea::placeholder { color: var(--text-tertiary); }

.editor-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 12px; padding-bottom: 40px;
}
.editor-footer .ef-meta { font-size: 0.78rem; color: var(--text-tertiary); }

/* ===== Idea Editor ===== */
.idea-editor-title {
  width: 100%; font-size: 1.2rem; font-weight: 600; border: none; background: transparent;
  padding: 8px 0; outline: none; border-bottom: 2px solid transparent;
  margin-bottom: 16px; font-family: inherit;
  transition: border-color var(--transition);
}
.idea-editor-title:focus { border-bottom-color: var(--accent); }
.idea-editor-content {
  width: 100%; min-height: 200px; padding: 16px;
  font-size: 0.95rem; line-height: 1.8;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text); resize: vertical;
  outline: none; font-family: inherit;
  transition: border-color var(--transition);
}
.idea-editor-content:focus { border-color: var(--accent); }

/* ===== Empty State ===== */
.empty-state {
  text-align: center; padding: 48px 20px; color: var(--text-tertiary);
}
.empty-state .empty-icon { font-size: 2rem; margin-bottom: 12px; opacity: 0.5; }
.empty-state .empty-text { font-size: 0.9rem; }

/* ===== Modal / Confirm Dialog ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.25);
  z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius); padding: 28px 24px 20px;
  max-width: 360px; width: 90%; box-shadow: 0 12px 40px rgba(0,0,0,0.12);
  animation: fadeIn 0.2s ease;
}
.modal h3 { margin-bottom: 8px; font-weight: 600; color: var(--text); }
.modal p { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
.modal .btn-group { justify-content: flex-end; }

/* ===== 文梗 · 王牌对王牌 ===== */
.prompts-sub { padding: 16px 0 40px; }
.tabs { display: flex; gap: 4px; margin: 4px 0 16px; border-bottom: 1px solid var(--border); }
.tab-btn {
  flex: 1; padding: 10px 0; background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--text-secondary); font-size: .92rem; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: all var(--transition);
}
.tab-btn svg { width: 16px; height: 16px; }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fadeIn .25s ease; }

/* 组合抽签 */
.draw-cats { display: flex; flex-wrap: wrap; gap: 8px; margin: 16px 0; }
.cat-chip {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-secondary); font-size: .82rem; cursor: pointer;
  transition: all var(--transition); font-family: inherit;
}
.cat-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); font-weight: 600; }
.combo-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px 20px; margin: 18px 0; transition: all var(--transition);
}
.combo-card .cc-row {
  display: flex; align-items: baseline; gap: 12px; padding: 7px 0;
  border-bottom: 1px dashed var(--border-light);
}
.combo-card .cc-row:last-child { border-bottom: none; }
.combo-card .cc-cat { font-size: .72rem; color: var(--text-tertiary); width: 56px; flex-shrink: 0; letter-spacing: .06em; }
.combo-card .cc-word { font-size: 1.05rem; font-weight: 600; }
.combo-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }

/* 对决 */
.vs-stage { text-align: center; }
.vs-pair { display: grid; grid-template-columns: 1fr auto 1fr; gap: 12px; align-items: stretch; margin: 18px 0; }
.vs-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 28px 14px; cursor: pointer; position: relative; transition: all .2s;
}
.vs-card:hover { border-color: var(--accent); box-shadow: var(--shadow-hover); transform: translateY(-3px); }
.vs-card .vs-kw { font-size: 1.35rem; font-weight: 700; }
.vs-card .vs-cat { font-size: .72rem; color: var(--text-tertiary); margin-top: 6px; letter-spacing: .08em; }
.vs-card.picked { animation: pickedOut .5s ease; border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }
.vs-card.eliminated { opacity: .35; filter: grayscale(1); }
.vs-verse { display: flex; align-items: center; justify-content: center; font-weight: 800; color: var(--accent); font-size: 1.1rem; }
.match-label { font-size: .82rem; color: var(--text-secondary); letter-spacing: .08em; }
.battle-tag { position: absolute; top: 8px; right: 10px; font-size: .68rem; letter-spacing: .1em; }
.vs-card.picked .battle-tag { color: var(--accent); font-weight: 700; }
.vs-card.eliminated .battle-tag { color: var(--text-tertiary); font-style: italic; }
.bracket { display: flex; gap: 16px; justify-content: center; margin: 20px 0 24px; flex-wrap: wrap; }
.lantern {
  width: 74px; padding: 6px 4px; border: 1px solid var(--border); border-radius: 6px;
  background: var(--surface); color: var(--text-tertiary); font-size: .7rem; text-align: center; transition: all .3s;
}
.lantern.lit { border-color: var(--accent); color: var(--text); box-shadow: 0 2px 8px var(--accent-light); }
.lantern.champion { animation: pulse 1.2s infinite; border-color: var(--accent); background: var(--accent-light); font-weight: 700; }
.champ-icon { width: 52px; height: 52px; margin: 0 auto 12px; color: var(--accent); animation: crownPop .5s ease; }
.champ-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 4px; }
.champ-sub { font-size: .82rem; color: var(--text-secondary); margin-bottom: 20px; }

@keyframes pickedOut { 0% { transform: scale(1); } 40% { transform: scale(1.06); } 100% { transform: scale(1); } }
@keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
@keyframes crownPop { 0% { transform: scale(0) rotate(-20deg); opacity: 0; } 70% { transform: scale(1.15); } 100% { transform: scale(1); } }

/* 题库 */
.pool-section-title { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 10px; }
.pool-section-title h3 { font-size: .92rem; color: var(--text-secondary); font-weight: 600; }
.pool-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
  margin-bottom: 8px; transition: all var(--transition);
}
.pool-item .pi-kw { font-weight: 600; flex: 1; }
.pool-item .pi-actions { display: flex; gap: 6px; flex-shrink: 0; }
.pool-item .pi-hidden-kw { opacity: .4; text-decoration: line-through; }
.tag {
  display: inline-block; font-size: .66rem; padding: 2px 8px; border-radius: 10px;
  background: var(--surface-alt); color: var(--text-secondary); border: 1px solid var(--border);
  flex-shrink: 0;
}
.tag.custom { color: var(--accent); border-color: var(--accent-light); background: var(--accent-light); }
.pool-search { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: .88rem; font-family: inherit; background: var(--surface); color: var(--text); outline: none; margin-bottom: 14px; }
.pool-search:focus { border-color: var(--accent); }

/* 收藏 */
.collected-stats { display: flex; gap: 14px; padding: 12px 14px; margin-bottom: 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: .82rem; color: var(--text-secondary); }
.collected-stats b { color: var(--text); }
.collected-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; margin-bottom: 10px; transition: all var(--transition);
}
.collected-card .cc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.collected-card .cc-title { font-weight: 600; flex: 1; }
.collected-card .cc-title.written { text-decoration: line-through; color: var(--text-secondary); }
.collected-card .cc-meta { font-size: .75rem; color: var(--text-tertiary); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.collected-card .cc-note { font-size: .82rem; color: var(--text-secondary); margin-top: 6px; font-style: italic; }
.collected-card .cc-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

.app-footer { margin-top: 48px; padding: 16px; text-align: center; font-size: .75rem; color: var(--text-tertiary); }

/* ===== Responsive ===== */
@media (max-width: 520px) {
  #app { padding: 0 16px; }
  .card-grid { grid-template-columns: 1fr; }
  .stats-bar { padding: 8px 4px; }
  .stat-item .si-value { font-size: 0.95rem; }
  .editor-toolbar { gap: 10px; padding: 8px 12px; }
  .editor-textarea { padding: 14px; min-height: calc(100vh - 340px); }
  .quick-actions { flex-direction: column; }
  .quick-actions .btn { padding: 10px; }
}

/* PWA standalone mode */
@media all and (display-mode: standalone) {
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); overscroll-behavior: none; }
  #app { padding-left: calc(20px + env(safe-area-inset-left)); padding-right: calc(20px + env(safe-area-inset-right)); }
  header { padding-top: max(20px, env(safe-area-inset-top)); }
  .editor-textarea { -webkit-overflow-scrolling: touch; }
}
@media all and (display-mode: standalone) and (max-width: 520px) {
  #app { padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); }
}
</style>
</head>
<body>

<div id="app">

  <!-- ===== HOME ===== -->
  <section id="page-home" class="page active">
    <header>
      <div class="title">笔间</div>
      <div class="actions" style="gap:6px;">
        <div class="theme-dots" id="theme-dots"></div>
        <button class="btn btn-sm btn-ghost" onclick="navigate('works')">作品</button>
        <button class="btn btn-sm btn-ghost" onclick="navigate('ideas')">灵感</button>

    </header>

    <div class="stats-bar" id="home-stats"></div>

    <div class="quick-actions">
      <button class="btn btn-primary" onclick="createNewWork()">+ 新作品</button>
      <button class="btn" onclick="createNewIdea()">* 记灵感</button>
      <button class="btn" onclick="navigate('prompts')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" style="width:15px;height:15px;"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h6"/></svg> 文梗</button>
      <button class="btn btn-sm install-btn" id="install-btn" style="display:none;" onclick="installApp()">↓ 安装</button>
    </div>

    <div class="section-header"><h2>最近更新</h2></div>
    <div class="recent-list" id="home-recent"></div>
    <footer class="app-footer" id="app-version"></footer>
  </section>

  <!-- ===== WORKS ===== -->
  <section id="page-works" class="page">
    <header>
      <button class="back" onclick="navigate('home')">← 返回</button>
      <div class="title">作品</div>
      <div class="actions">
        <button class="btn btn-sm btn-primary" onclick="createNewWork()">+ 新建</button>
      </div>
    </header>
    <div id="works-filter" style="display:flex;gap:6px;margin-bottom:16px;">
      <button class="btn btn-sm filter-btn active-filter" data-filter="all" onclick="filterWorks('all')">全部</button>
      <button class="btn btn-sm filter-btn" data-filter="novel" onclick="filterWorks('novel')">小说</button>
      <button class="btn btn-sm filter-btn" data-filter="idea" onclick="filterWorks('idea')">灵感</button>
    </div>
    <div class="card-grid" id="works-grid"></div>
  </section>

  <!-- ===== EDITOR ===== -->
  <section id="page-editor" class="page">
    <header>
      <button class="back" onclick="navigate('works')">← 返回</button>
      <div class="actions">
        <button class="btn btn-sm btn-ghost" onclick="exportWork()" id="btn-export">↓ 导出</button>
        <button class="btn btn-sm btn-ghost" onclick="deleteCurrentWork()" id="btn-delete-work" style="color:var(--text-tertiary)">× 删除</button>
      </div>
    </header>

    <div class="editor-header">
      <input type="text" class="editor-title-input" id="editor-title" placeholder="作品标题" spellcheck="false">
      <span class="editor-save-status" id="editor-save-status"></span>
    </div>

    <div class="editor-toolbar">
      <div class="tool-group">
        <span class="tool-label">字号</span>
        <input type="range" id="font-size-slider" min="12" max="28" value="16">
        <span class="tool-value" id="font-size-label">16</span>
      </div>
      <div class="tool-group" style="margin-left:auto;">
        <span class="editor-wordcount" id="editor-wordcount">0 字</span>
      </div>
      <div class="tool-group">
        <span class="editor-timer"><span class="timer-icon">◷</span> <span id="editor-timer">00:00:00</span></span>
      </div>
    </div>

    <textarea class="editor-textarea" id="editor-content" placeholder="开始写吧……"></textarea>

    <div class="editor-footer">
      <span class="ef-meta" id="editor-last-saved"></span>
    </div>
  </section>

  <!-- ===== IDEAS ===== -->
  <section id="page-ideas" class="page">
    <header>
      <button class="back" onclick="navigate('home')">← 返回</button>
      <div class="title">灵感</div>
      <div class="actions">
        <button class="btn btn-sm btn-primary" onclick="createNewIdea()">+ 新建</button>
      </div>
    </header>
    <div class="card-grid" id="ideas-grid"></div>
  </section>

  <!-- ===== IDEA EDITOR ===== -->
  <section id="page-idea-editor" class="page">
    <header>
      <button class="back" onclick="navigate('ideas')">← 返回</button>
      <div class="title">编辑灵感</div>
      <div class="actions">
        <button class="btn btn-sm btn-ghost" onclick="deleteCurrentIdea()" style="color:var(--text-tertiary)">× 删除</button>
      </div>
    </header>
    <input type="text" class="idea-editor-title" id="idea-editor-title" placeholder="灵感标题" spellcheck="false">
    <textarea class="idea-editor-content" id="idea-editor-content" placeholder="记录你的灵感……"></textarea>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;padding-bottom:40px;">
      <button class="btn btn-primary" onclick="saveIdeaEdit()">保存</button>
    </div>
  </section>

  <!-- ===== 文梗 · 王牌对王牌 ===== -->
  <section id="page-prompts" class="page">
    <header>
      <button class="back" onclick="navigate('home')">← 返回</button>
      <div class="title">文梗</div>
      <div class="actions">
        <span class="editor-save-status" id="prompts-count"></span>
      </div>
    </header>

    <nav class="tabs" id="prompts-tabs">
      <button class="tab-btn active" data-tab="draw" onclick="setPromptsTab('draw')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h6"/></svg>抽签
      </button>
      <button class="tab-btn" data-tab="battle" onclick="setPromptsTab('battle')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M5 5l14 14M19 5L5 19"/></svg>对决
      </button>
      <button class="tab-btn" data-tab="pool" onclick="setPromptsTab('pool')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>题库
      </button>
      <button class="tab-btn" data-tab="collected" onclick="setPromptsTab('collected')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.9-5.4 2.9 1-6L3.3 9.4l6-.9z"/></svg>收藏

    <div class="prompts-sub">

        <div class="btn-group" style="justify-content:center;">
          <button class="btn btn-primary" id="btn-draw" onclick="doDraw()">抽一题</button>
          <button class="btn" id="btn-redraw" style="display:none;" onclick="redraw()">换一批</button>
        </div>
        <div id="combo-area"></div>
        <div class="btn-group" id="draw-actions" style="display:none;justify-content:center;margin-top:14px;">
          <button class="btn btn-primary" onclick="writeFromCombo()">开写</button>

      <!-- 对决 -->

      <!-- 题库 -->

      <!-- 收藏 -->

          <button class="btn btn-sm filter-btn active-filter" data-f="all" onclick="setCollectedFilter('all')">全部</button>
          <button class="btn btn-sm filter-btn" data-f="unwritten" onclick="setCollectedFilter('unwritten')">未写</button>
          <button class="btn btn-sm filter-btn" data-f="written" onclick="setCollectedFilter('written')">已写</button>
        </div>
        <div id="collected-list"></div>
      </div>
    </div>
  </section>

  <!-- ===== 文梗编辑弹窗 ===== -->
  <div class="modal-overlay" id="prompt-modal-overlay">
    <div class="modal">
      <h3 id="prompt-modal-title">新增文梗</h3>
      <div style="margin-bottom:14px;">
        <div style="font-size:.78rem;color:var(--text-secondary);margin-bottom:6px;">关键词</div>

      <div class="btn-group">
        <button class="btn" onclick="closeNoteModal()">取消</button>
        <button class="btn btn-primary" onclick="saveCollectedNote()">保存</button>
      </div>
    </div>

  <!-- ===== Modal ===== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-title">确认</h3>

      </div>

</div>

<script>
// ============================================================
// DATA LAYER
// ============================================================
const DB = {
  getWorks() {
    try { return JSON.parse(localStorage.getItem('writing_works') || '[]'); } catch { return []; }
  },
  saveWorks(works) {
    localStorage.setItem('writing_works', JSON.stringify(works));
  },
  getSettings() {
    try { return JSON.parse(localStorage.getItem('writing_settings') || '{"fontSize":16}'); } catch { return {fontSize:16}; }
  },
  saveSettings(s) {
    localStorage.setItem('writing_settings', JSON.stringify(s));
  },
  getPrompts() { try { return JSON.parse(localStorage.getItem('writing_prompts_custom') || '[]'); } catch { return []; } },
  savePrompts(a) { localStorage.setItem('writing_prompts_custom', JSON.stringify(a)); },
  getHidden() { try { return JSON.parse(localStorage.getItem('writing_prompts_hidden') || '[]'); } catch { return []; } },
  saveHidden(a) { localStorage.setItem('writing_prompts_hidden', JSON.stringify(a)); },
  getCollected() { try { return JSON.parse(localStorage.getItem('writing_collected') || '[]'); } catch { return []; } },
  saveCollected(a) { localStorage.setItem('writing_collected', JSON.stringify(a)); },
  getMeta() { try { return JSON.parse(localStorage.getItem('writing_meta') || 'null'); } catch { return null; } },
  saveMeta(m) { localStorage.setItem('writing_meta', JSON.stringify(m)); },
  genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
};

// ============================================================
// 文梗题库
// ============================================================
const CATEGORIES = [
  { key: '世界观', words: ['都市', '校园', '古风', '民国', '星际', '末世', '修真', '西幻', '宫廷', '江湖', '娱乐圈', '电竞', '童话', '海洋', '乡村', '古代', '神鬼', '苗疆'] },
  { key: '人物关系', words: ['青梅竹马', '欢喜冤家', '宿敌', '死对头', '姐弟恋', '兄妹', '网友奔现', '笔友', '邻居', '合租', '替身', '白月光', '双向暗恋', '单向暗恋', '上司下属', '师徒', '伪骨科', '养成系', '年上', '年下', '仇人子女'] },
  { key: '设定', words: ['失忆', '重生', '穿越', '平行时空', '系统', '读心术', '非人恋', '灵魂互换', '哑巴恋人', '盲眼', '病弱', '卧底', '双面人生', '古穿今', '黑化', '穿书', '快穿', '金手指', '契约婚姻', '先婚后爱'] },
  { key: '情节', words: ['破镜重圆', '久别重逢', '追妻火葬场', '救赎', '双向奔赴', '一见钟情', '十年之约', '分手旅行', '假戏真做', '伪装情侣', '婚约', '破冰', 'he改be', 'be改he', '破镜难圆', '复合'] },
  { key: '形式', words: ['只写对话', '第二人称', '旁观者视角', '开放式结局', 'BE美学', '字数限定', '书信体', '倒叙', '日记体', '反转结局', '第一人称'] },
];
const BUILTIN_TROPES = CATEGORIES.flatMap(c => c.words.map(w => ({ keyword: w, category: c.key })));
const APP_VERSION = 'v1.1.0 (2026.08.12)';

// ============================================================
// THEME SYSTEM
// ============================================================
const THEMES = {
  default:  { name: '原木', dot: '#c4a882' },
  sky:      { name: '晴空', dot: '#bae6fb' },
  mint:     { name: '薄荷', dot: '#86cfa3' },
  cream:    { name: '奶油', dot: '#fde68a' },
  white:    { name: '纯白', dot: '#d0d0d0' },
  dusk:     { name: '暮色', dot: '#8a8070' },
  navy:     { name: '夜蓝', dot: '#5a7a9a' },
  charcoal: { name: '雾灰', dot: '#787878' },
};

function setTheme(key) {
  if (!THEMES[key]) key = 'default';
  document.documentElement.setAttribute('data-theme', key);
  localStorage.setItem('writing_theme', key);
  // Update browser theme color for PWA
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    meta.setAttribute('content', bg || '#f8f6f3');
  }
  // Update dots active state
  document.querySelectorAll('.theme-dot').forEach(el => {
    el.classList.toggle('active', el.dataset.theme === key);
  });
}

function getTheme() {
  return localStorage.getItem('writing_theme') || 'default';
}

function renderThemeDots() {
  const container = document.getElementById('theme-dots');
  if (!container) return;
  const current = getTheme();
  container.innerHTML = Object.entries(THEMES).map(([key, t]) =>
    `<div class="theme-dot ${key === current ? 'active' : ''}" data-theme="${key}"
         style="background:${t.dot}" title="${t.name}"
         onclick="setTheme('${key}')"></div>`
  ).join('');
}

// ============================================================
// STATE
// ============================================================
let state = {
  currentWorkId: null,
  currentIdeaId: null,
  worksFilter: 'novel',
  timerInterval: null,
  timerStartTime: null,
  timerAccumulated: 0,
  saveTimeout: null,
  lastContent: '',
  // 文梗
  promptsTab: 'draw',     // draw | battle | pool | collected
  drawCats: null,         // {世界观:true, ...}
  combo: null,            // 最近组合题 {维度:词}
  comboSelected: false,
  battle: null,           // 对决状态
  showHidden: false,
  collectedFilter: 'all',
  poolSearch: '',
  editingPromptId: null,
};

// ============================================================
// ROUTER
// ============================================================
function navigate(page, params) {
  window.location.hash = page + (params ? '?' + params : '');
}

function getPageFromHash() {
  const hash = window.location.hash.slice(1) || 'home';
  const parts = hash.split('?');
  return { page: parts[0], params: parts[1] || '' };
}

function parseParams(qs) {
  const params = {};
  if (!qs) return params;
  qs.split('&').forEach(p => {
    const [k, v] = p.split('=');
    params[decodeURIComponent(k)] = decodeURIComponent(v || '');
  });
  return params;
}

function router() {
  const { page, params } = getPageFromHash();
  const p = parseParams(params);

  // Hide all pages
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));

  // Stop any running timer
  stopTimer();

  switch (page) {
    case 'home':
      document.getElementById('page-home').classList.add('active');
      renderHome();
      break;
    case 'works':
      document.getElementById('page-works').classList.add('active');
      renderWorks();
      break;
    case 'editor':
      document.getElementById('page-editor').classList.add('active');
      state.currentWorkId = p.id || null;
      initEditor(state.currentWorkId);
      break;
    case 'ideas':
      document.getElementById('page-ideas').classList.add('active');
      renderIdeas();
      break;
    case 'idea-editor':
      document.getElementById('page-idea-editor').classList.add('active');
      state.currentIdeaId = p.id || null;
      initIdeaEditor(state.currentIdeaId);
      break;
    case 'prompts':
      document.getElementById('page-prompts').classList.add('active');
      if (p.tab && ['draw', 'battle', 'pool', 'collected'].includes(p.tab)) state.promptsTab = p.tab;
      renderPromptsPage();
      break;
    default:
      document.getElementById('page-home').classList.add('active');
      renderHome();
  }
}

window.addEventListener('hashchange', router);

// ============================================================
// HELPERS
// ============================================================
function countChars(text) {
  if (!text) return 0;
  // Count all non-whitespace characters (standard for Chinese word count)
  return text.replace(/\s/g, '').length;
}

function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function formatTimeShort(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm ' + (totalSec % 60) + 's';
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  if (diff < 172800000) return '昨天';
  return (d.getMonth() + 1) + '/' + d.getDate();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================================
// 文梗 · 工具
// ============================================================
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandomN(pool, n) {
  if (!pool || pool.length === 0) return [];
  return shuffle(pool).slice(0, Math.min(n, pool.length));
}

// 运行时合并：内置(过滤隐藏) + 自定义；每个词都有稳定 id（对决晋级判断依赖它）
function getAllPrompts() {
  const hidden = DB.getHidden();
  const builtins = BUILTIN_TROPES
    .filter(p => !hidden.includes(p.keyword))
    .map(p => ({ id: 'b_' + p.keyword, ...p, source: 'builtin' }));
  const customs = DB.getPrompts()
    .filter(p => !hidden.includes(p.keyword))
    .map(p => ({ ...p, source: 'custom' }));
  return [...builtins, ...customs];
}

function getPromptsByCategory(cat) {
  return getAllPrompts().filter(p => p.category === cat);
}

function normalizeCollected(c) {
  return Object.assign({ id: '', title: '', combo: null, keyword: '', source: 'draw', champion: false, note: '', written: false, writtenAt: null, createdAt: new Date().toISOString() }, c);
}

function migrateData() {
  let meta = DB.getMeta();
  if (!meta || typeof meta.schemaVersion !== 'number') meta = { schemaVersion: 0 };
  if (meta.schemaVersion < 1) {
    if (!Array.isArray(DB.getPrompts())) DB.savePrompts([]);
    if (!Array.isArray(DB.getHidden())) DB.saveHidden([]);
    if (!Array.isArray(DB.getCollected())) DB.saveCollected(DB.getCollected().map(normalizeCollected));
    meta.schemaVersion = 1;
  }
  DB.saveMeta(meta);
}

function initEditor(id) {
  const titleInput = document.getElementById('editor-title');
  const contentArea = document.getElementById('editor-content');
  const saveStatus = document.getElementById('editor-save-status');
  const lastSaved = document.getElementById('editor-last-saved');
  const wordCount = document.getElementById('editor-wordcount');

  // Load settings
  const settings = DB.getSettings();
  contentArea.style.fontSize = settings.fontSize + 'px';
  document.getElementById('font-size-slider').value = settings.fontSize;
  document.getElementById('font-size-label').textContent = settings.fontSize;

  let work;
  if (id) {
    const works = DB.getWorks();
    work = works.find(w => w.id === id);
  }

  if (work) {
    titleInput.value = work.title || '';
    contentArea.value = work.content || '';
    state.timerAccumulated = work.totalWritingTimeMs || 0;
    saveStatus.textContent = '✓ 已保存';
    lastSaved.textContent = '最后保存：' + formatDate(work.updatedAt);
  } else {
    // Create new work
    work = {
      id: DB.genId(),
      title: '',
      type: 'novel',
      content: '',
      createdAt: new Date().toISOString(),
      updatedAt: new Date().toISOString(),
      totalWritingTimeMs: 0,
    };
    const works = DB.getWorks();
    works.push(work);
    DB.saveWorks(works);
    state.currentWorkId = work.id;
    titleInput.value = '';
    contentArea.value = '';
    state.timerAccumulated = 0;
    saveStatus.textContent = '新作品';
    lastSaved.textContent = '';
  }

  state.lastContent = contentArea.value;
  updateWordCount();

  // Start timer
  startTimer();

  // Auto-save handler
  contentArea.oninput = () => {
    updateWordCount();
    scheduleAutoSave();
  };

  titleInput.oninput = () => {
    scheduleAutoSave();
  };

  // Font size slider
  document.getElementById('font-size-slider').oninput = function() {
    const size = parseInt(this.value);
    contentArea.style.fontSize = size + 'px';
    document.getElementById('font-size-label').textContent = size;
    const s = DB.getSettings();
    s.fontSize = size;
    DB.saveSettings(s);
  };

  // Keyboard shortcut: Ctrl+S to save
  contentArea.onkeydown = (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveCurrentWork();
    }
  };

  // Focus content area
  setTimeout(() => contentArea.focus(), 100);
}

function updateWordCount() {
  const content = document.getElementById('editor-content').value;
  document.getElementById('editor-wordcount').textContent = countChars(content).toLocaleString() + ' 字';
}

function scheduleAutoSave() {
  const status = document.getElementById('editor-save-status');
  status.textContent = '保存中...';
  if (state.saveTimeout) clearTimeout(state.saveTimeout);
  state.saveTimeout = setTimeout(saveCurrentWork, 1500);
}

function saveCurrentWork() {
  const id = state.currentWorkId;
  if (!id) return;

  const works = DB.getWorks();
  const work = works.find(w => w.id === id);
  if (!work) return;

  const title = document.getElementById('editor-title').value.trim();
  const content = document.getElementById('editor-content').value;

  work.title = title || '未命名';
  work.content = content;
  work.updatedAt = new Date().toISOString();
  work.totalWritingTimeMs = state.timerAccumulated + (state.timerStartTime ? Date.now() - state.timerStartTime : 0);

  DB.saveWorks(works);

  const status = document.getElementById('editor-save-status');
  status.textContent = '✓ 已保存';
  document.getElementById('editor-last-saved').textContent = '最后保存：刚刚';
  state.lastContent = content;
}

function exportWork() {
  const id = state.currentWorkId;
  if (!id) return;
  const works = DB.getWorks();
  const work = works.find(w => w.id === id);
  if (!work) return;

  const title = work.title || '未命名';
  const content = work.content || '';
  const wordCount = countChars(content);
  const time = formatTimeShort(work.totalWritingTimeMs || 0);

  // Generate Word-compatible HTML
  const htmlContent = content.replace(/\n/g, '<br>').replace(/\s{2}/g, '&nbsp;&nbsp;');
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset="utf-8"><title>${escapeHtml(title)}</title>
<style>body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:12pt;line-height:1.8;padding:40px;max-width:600px;margin:0 auto;}
h1{font-size:18pt;text-align:center;margin-bottom:30px;font-weight:600;}
.meta{text-align:center;font-size:9pt;color:#888;margin-bottom:40px;}
p{margin:0 0 8px 0;text-indent:2em;}
</style></head>
<body>
<h1>${escapeHtml(title)}</h1>
<div class="meta">${wordCount} 字 · 写作时长 ${time}</div>
${htmlContent.split('<br>').map(p => '<p>' + p + '</p>').join('\n')}
</body></html>`;

  const blob = new Blob(['﻿' + html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = title + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function deleteCurrentWork() {
  const id = state.currentWorkId;
  if (!id) return;
  showModal('删除作品', '确定要删除这个作品吗？', () => {
    let works = DB.getWorks();
    works = works.filter(w => w.id !== id);
    DB.saveWorks(works);
    navigate('works');
  });
}

// ============================================================
// TIMER
// ============================================================
function startTimer() {
  if (state.timerInterval) return;
  state.timerStartTime = Date.now();
  state.timerInterval = setInterval(() => {
    const elapsed = state.timerAccumulated + (Date.now() - state.timerStartTime);
    document.getElementById('editor-timer').textContent = formatTime(elapsed);
    // Auto-save timer progress every 10 seconds
    if (Math.floor(elapsed / 10000) > Math.floor((elapsed - 1000) / 10000)) {
      // Only update the saved time, don't do a full save every 10s
    }
  }, 1000);
}

function stopTimer() {
  if (!state.timerInterval) return;

  // Save accumulated time + latest content
  if (state.currentWorkId && state.timerStartTime) {
    const works = DB.getWorks();
    const work = works.find(w => w.id === state.currentWorkId);
    if (work) {
      work.totalWritingTimeMs = state.timerAccumulated + (Date.now() - state.timerStartTime);
      work.updatedAt = new Date().toISOString();
      // Save latest content
      const titleEl = document.getElementById('editor-title');
      const contentEl = document.getElementById('editor-content');
      if (titleEl) work.title = titleEl.value.trim() || '未命名';
      if (contentEl) work.content = contentEl.value;
      DB.saveWorks(works);
    }
  }

  clearInterval(state.timerInterval);
  state.timerInterval = null;
  state.timerStartTime = null;
  state.timerAccumulated = 0;
  // Clear any pending save timeout
  if (state.saveTimeout) {
    clearTimeout(state.saveTimeout);
    state.saveTimeout = null;
  }
}

// ---------- 抽签（组合抽） ----------
function renderDrawPanel() {
  if (!state.drawCats) {
    state.drawCats = {};
    CATEGORIES.forEach(c => state.drawCats[c.key] = true);
  }
  renderDrawCats();
  if (state.combo) renderCombo();
  updateDrawActions();
}

function renderDrawCats() {
  const el = document.getElementById('draw-cats');
  el.innerHTML = CATEGORIES.map(c => {
    const on = state.drawCats[c.key];
    return `<button class="cat-chip ${on ? 'active' : ''}" onclick="toggleDrawCat('${c.key}')">${c.key}</button>`;
  }).join('');
}

function toggleDrawCat(cat) {
  state.drawCats[cat] = !state.drawCats[cat];
  if (!Object.values(state.drawCats).some(Boolean)) state.drawCats[cat] = true;
  renderDrawCats();
  state.combo = null;
  state.comboSelected = false;
  renderCombo();
  updateDrawActions();
}

function doDraw() {
  const cats = CATEGORIES.filter(c => state.drawCats[c.key]);
  if (cats.length === 0) { toast('先勾选至少一个维度'); return; }
  const combo = {};
  cats.forEach(c => {
    const pool = getPromptsByCategory(c.key);
    if (pool.length > 0) combo[c.key] = pickRandomN(pool, 1)[0].keyword;
  });
  if (Object.keys(combo).length === 0) { toast('题库空了，先去题库加几个文梗'); return; }
  state.combo = combo;
  state.comboSelected = false;
  renderCombo();
  updateDrawActions();
}

function redraw() { doDraw(); }

function renderCombo() {
  const area = document.getElementById('combo-area');
  if (!state.combo) { area.innerHTML = ''; return; }
  const rows = CATEGORIES.filter(c => state.combo[c.key]).map(c => `
    <div class="cc-row">
      <div class="cc-cat">${c.key}</div>
      <div class="cc-word">${escapeHtml(state.combo[c.key])}</div>
    </div>`).join('');
  area.innerHTML = `<div class="combo-card ${state.comboSelected ? 'selected' : ''}" onclick="selectCombo()">${rows}</div>`;
}

function selectCombo() {
  if (!state.combo) return;
  state.comboSelected = !state.comboSelected;
  renderCombo();
  updateDrawActions();
}

function comboTitle() {
  if (!state.combo) return '';
  return Object.values(state.combo).join(' × ');
}

function updateDrawActions() {
  document.getElementById('btn-redraw').style.display = state.combo ? '' : 'none';
  document.getElementById('draw-actions').style.display = (state.combo && state.comboSelected) ? '' : 'none';
}

function collectCombo() {
  if (!state.combo) return;
  collectItem({ title: comboTitle(), combo: Object.assign({}, state.combo), source: 'draw' });
}

function writeFromCombo() {
  if (!state.combo) return;
  createWorkFromPrompt(comboTitle(), comboTitle());
}

// ---------- 对决（关键词 PK） ----------
function startBattle() {
  // 对决只用世界观/人物/设定/情节，排除「形式」（写法规矩不适合对打）
  const pool = pickRandomN(getAllPrompts().filter(p => p.category !== '形式'), 8);
  if (pool.length < 2) { toast('题库不够，先去题库加几个文梗'); return; }
  state.battle = {
    phase: 'fight', round: 0, matchIdx: 0, _picking: false,
    players: pool, winners: [], champion: null,
    currentPair: [pool[0], pool[1]],
  };
  saveBattleSession();
  renderBattle();
}

function battleMatchLabel() {
  const b = state.battle;
  const total = b.players.length / 2;
  const names = b.round === 0 ? '八强' : b.round === 1 ? '半决赛' : '决赛';
  return b.round === 2 ? names : `${names} · 第 ${Math.min(b.matchIdx + 1, total)}/${total} 场`;
}

function renderBattle() {
  const root = document.getElementById('battle-root');
  if (!root) return;
  if (!state.battle && sessionStorage.getItem('writing_battle_session')) restoreBattleSession();
  const b = state.battle;
  if (!b || b.phase === 'idle') {
    root.innerHTML = `
      <div class="vs-stage">
        <div class="empty-state" style="padding:48px 20px;">
          <div style="opacity:.35;">${crownSvg}</div>
          <div class="empty-text" style="font-size:1rem;">八强集结，谁是你的王牌？</div>
        </div>
        <button class="btn btn-primary" onclick="startBattle()">开始对决</button>
      </div>`;
    return;
  }
  if (b.phase === 'champion') {
    const kw = b.champion ? escapeHtml(b.champion.keyword) : '';
    root.innerHTML = `
      <div class="vs-stage">
        <div class="champ-icon">${crownSvg}</div>
        <div class="champ-title">本期王牌 · ${kw}</div>
        <div class="champ-sub">8 强 → 冠军</div>
        <div class="btn-group" style="justify-content:center;">
          <button class="btn btn-primary" onclick="writeBattleChampion()">开写</button>
          <button class="btn" onclick="collectBattleChampion()">收藏</button>
          <button class="btn" onclick="restartBattle()">再来一局</button>
          <button class="btn" onclick="exitBattle()">退出</button>
        </div>
      </div>`;
    return;
  }
  const [a, b2] = b.currentPair;
  root.innerHTML = `
    <div style="text-align:center;margin-bottom:6px;"><span class="match-label">${battleMatchLabel()}</span></div>
    <div class="vs-pair">
      <div class="vs-card" onclick="pickBattle(0)">
        <div class="vs-kw">${escapeHtml(a.keyword)}</div>
        <div class="vs-cat">${escapeHtml(a.category)}</div>
      </div>
      <div class="vs-verse">VS</div>
      <div class="vs-card" onclick="pickBattle(1)">
        <div class="vs-kw">${escapeHtml(b2.keyword)}</div>
        <div class="vs-cat">${escapeHtml(b2.category)}</div>
      </div>
    </div>
    ${renderBracket(b)}
    <div class="btn-group" style="justify-content:center;margin-top:8px;">
      <button class="btn btn-sm" onclick="confirmRestartBattle()">重新开局</button>
      <button class="btn btn-sm" onclick="confirmExitBattle()">退出对决</button>
    </div>`;
}

function renderBracket(b) {
  const start = b.matchIdx * 2;
  return `<div class="bracket">${b.players.map((p, i) => {
    let cls = 'lantern';
    if (b.winners.some(w => w.id === p.id)) cls += ' lit';
    if (i >= start && i < start + 2) cls += ' lit';
    return `<div class="${cls}">${escapeHtml(p.keyword)}</div>`;
  }).join('')}</div>`;
}

function pickBattle(idx) {
  const b = state.battle;
  if (!b || b.phase !== 'fight' || b._picking) return;
  b._picking = true;
  const cards = document.querySelectorAll('#battle-root .vs-card');
  if (cards.length === 2) {
    cards[idx].classList.add('picked');
    cards[1 - idx].classList.add('eliminated');
  }
  const winner = b.currentPair[idx];
  setTimeout(() => {
    b.winners.push(winner);
    const perRound = b.players.length / 2;
    if (b.winners.length === perRound) {
      if (b.round < 2) {
        b.round++; b.players = b.winners; b.winners = []; b.matchIdx = 0;
      } else {
        b.phase = 'champion'; b.champion = b.winners[0];
        clearBattleSession();
        b._picking = false;
        renderBattle();
        return;
      }
    } else {
      b.matchIdx++;
    }
    b.currentPair = [b.players[b.matchIdx * 2], b.players[b.matchIdx * 2 + 1]];
    b._picking = false;
    saveBattleSession();
    renderBattle();
  }, 850);
}

function confirmRestartBattle() {
  showModal('重新开局', '将重新抽取 8 个文梗，当前进度清空。确定？', () => { startBattle(); });
}
function confirmExitBattle() {
  showModal('退出对决', '退出后当前进度不保留。确定退出？', () => { exitBattle(); });
}
function restartBattle() { startBattle(); }
function exitBattle() {
  state.battle = null;
  clearBattleSession();
  renderBattle();
}
function collectBattleChampion() {
  const b = state.battle;
  if (!b || !b.champion) return;
  collectItem({ title: b.champion.keyword, keyword: b.champion.keyword, source: 'battle', champion: true });
}
function writeBattleChampion() {
  const b = state.battle;
  if (!b || !b.champion) return;
  createWorkFromPrompt(b.champion.keyword, b.champion.keyword);
}
function saveBattleSession() {
  try { sessionStorage.setItem('writing_battle_session', JSON.stringify(state.battle)); } catch (e) {}
}
function clearBattleSession() {
  try { sessionStorage.removeItem('writing_battle_session'); } catch (e) {}
}
function restoreBattleSession() {
  try {
    const raw = sessionStorage.getItem('writing_battle_session');
    if (raw) { state.battle = JSON.parse(raw); return true; }
  } catch (e) {}
  return false;
}

// ---------- 题库 ----------
function renderPool() {
  const search = ((document.getElementById('pool-search') || {}).value || '').trim();
  const hidden = DB.getHidden();
  const customs = DB.getPrompts().filter(p => p.keyword.includes(search));
  const builtins = BUILTIN_TROPES.filter(p => p.keyword.includes(search));
  const shown = builtins.filter(p => !hidden.includes(p.keyword));
  const hiddens = builtins.filter(p => hidden.includes(p.keyword));

  let html = '';
  html += `<div class="pool-section-title"><h3>我的文梗（${customs.length}）</h3></div>`;
  if (customs.length === 0) {
    html += `<div class="empty-state" style="padding:20px 16px;"><div class="empty-text">还没有自定义文梗，点「+ 新增文梗」加一个</div></div>`;
  } else {
    html += customs.map(p => `
      <div class="pool-item">
        <span class="tag custom">我的</span>
        <span class="pi-kw">${escapeHtml(p.keyword)}</span>
        <span class="tag">${escapeHtml(p.category)}</span>
        <span class="pi-actions">
          <button class="btn btn-sm btn-ghost" onclick="openPromptEditor('${p.id}')">编辑</button>
          <button class="btn btn-sm btn-ghost" style="color:var(--text-tertiary)" onclick="deletePrompt('${p.id}')">删除</button>
        </span>
      </div>`).join('');
  }
  html += `<div class="pool-section-title"><h3>内置题库（${shown.length}）</h3></div>`;
  html += shown.map(p => `
    <div class="pool-item">
      <span class="tag">内置</span>
      <span class="pi-kw">${escapeHtml(p.keyword)}</span>
      <span class="tag">${escapeHtml(p.category)}</span>
      <span class="pi-actions">
        <button class="btn btn-sm btn-ghost" onclick="toggleHidePrompt('${p.keyword}')">隐藏</button>
      </span>
    </div>`).join('');
  if (state.showHidden && hiddens.length > 0) {
    html += `<div class="pool-section-title"><h3>已隐藏（${hiddens.length}）</h3></div>`;
    html += hiddens.map(p => `
      <div class="pool-item">
        <span class="tag">内置</span>
        <span class="pi-kw pi-hidden-kw">${escapeHtml(p.keyword)}</span>
        <span class="pi-actions">
          <button class="btn btn-sm btn-ghost" onclick="toggleHidePrompt('${p.keyword}')">恢复</button>
        </span>
      </div>`).join('');
  }
  document.getElementById('pool-list').innerHTML = html;
  document.getElementById('btn-show-hidden').textContent = state.showHidden ? '收起已隐藏' : '显示已隐藏';
}

function toggleShowHidden() {
  state.showHidden = !state.showHidden;
  renderPool();
}

function toggleHidePrompt(keyword) {
  const hidden = DB.getHidden();
  if (hidden.includes(keyword)) DB.saveHidden(hidden.filter(k => k !== keyword));
  else DB.saveHidden([...hidden, keyword]);
  renderPool();
  document.getElementById('prompts-count').textContent = '题库 ' + getAllPrompts().length;
}

function openPromptEditor(id) {
  state.editingPromptId = id || null;
  const sel = document.getElementById('prompt-category');
  sel.innerHTML = CATEGORIES.map(c => `<option value="${c.key}">${c.key}</option>`).join('');
  const kw = document.getElementById('prompt-keyword');
  if (id) {
    const p = DB.getPrompts().find(x => x.id === id);
    if (p) {
      document.getElementById('prompt-modal-title').textContent = '编辑文梗';
      kw.value = p.keyword;
      sel.value = p.category;
    }
  } else {
    document.getElementById('prompt-modal-title').textContent = '新增文梗';
    kw.value = '';
    sel.value = CATEGORIES[0].key;
  }
  document.getElementById('prompt-modal-overlay').classList.add('show');
  setTimeout(() => kw.focus(), 80);
}

function closePromptModal() {
  document.getElementById('prompt-modal-overlay').classList.remove('show');
  state.editingPromptId = null;
}

function savePrompt() {
  const kw = document.getElementById('prompt-keyword').value.trim();
  const cat = document.getElementById('prompt-category').value;
  if (!kw) { toast('关键词不能为空'); return; }
  const editing = state.editingPromptId;
  const dup = getAllPrompts().find(p => p.keyword === kw && p.id !== editing);
  if (dup) {
    showModal('重复了', `题库里已有「${dup.keyword}」，还要添加吗？`, () => { savePromptForce(kw, cat, editing); });
    return;
  }
  savePromptForce(kw, cat, editing);
}

function savePromptForce(kw, cat, editing) {
  const prompts = DB.getPrompts();
  if (editing) {
    const p = prompts.find(x => x.id === editing);
    if (p) { p.keyword = kw; p.category = cat; p.updatedAt = new Date().toISOString(); }
  } else {
    prompts.push({ id: DB.genId(), keyword: kw, category: cat, createdAt: new Date().toISOString() });
  }
  DB.savePrompts(prompts);
  closePromptModal();
  renderPool();
  document.getElementById('prompts-count').textContent = '题库 ' + getAllPrompts().length;
  toast(editing ? '已更新' : '已新增');
}

function deletePrompt(id) {
  showModal('删除文梗', '确定删除这个自定义文梗？', () => {
    DB.savePrompts(DB.getPrompts().filter(p => p.id !== id));
    renderPool();
    document.getElementById('prompts-count').textContent = '题库 ' + getAllPrompts().length;
  });
}

// ---------- 收藏 ----------
function renderCollected() {
  const all = DB.getCollected();
  const written = all.filter(c => c.written).length;
  document.getElementById('collected-stats').innerHTML =
    `<span>共 <b>${all.length}</b></span><span>已写 <b>${written}</b></span><span>未写 <b>${all.length - written}</b></span>`;
  document.querySelectorAll('#page-prompts [data-panel="collected"] .filter-btn').forEach(btn => {
    btn.classList.toggle('active-filter', btn.dataset.f === state.collectedFilter);
  });
  const list = all.filter(c => {
    if (state.collectedFilter === 'written') return c.written;
    if (state.collectedFilter === 'unwritten') return !c.written;
    return true;
  });
  const el = document.getElementById('collected-list');
  if (list.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-text">还没有收藏的文梗，去抽一题或打一场吧</div></div>`;
    return;
  }
  el.innerHTML = list.map(c => {
    const badge = c.source === 'battle' ? (c.champion ? '对决 · 冠军' : '对决') : '抽签';
    return `
    <div class="collected-card">
      <div class="cc-top">
        <span class="cc-title ${c.written ? 'written' : ''}">${escapeHtml(c.title)}</span>
        <span class="tag ${c.written ? '' : 'custom'}">${c.written ? '已写' : '未写'}</span>
      </div>
      <div class="cc-meta">
        <span>${badge}</span>
        <span>${formatDate(c.createdAt)}</span>
      </div>
      ${c.note ? `<div class="cc-note">${escapeHtml(c.note)}</div>` : ''}
      <div class="cc-actions">
        <button class="btn btn-sm btn-primary" onclick="writeFromCollected('${c.id}')">开写</button>
        <button class="btn btn-sm" onclick="toggleCollectedWritten('${c.id}')">${c.written ? '标记未写' : '标记已写'}</button>
        <button class="btn btn-sm" onclick="editCollectedNote('${c.id}')">${c.note ? '改备注' : '加备注'}</button>
        <button class="btn btn-sm" style="color:var(--text-tertiary)" onclick="deleteCollected('${c.id}')">删除</button>
      </div>
    </div>`;
  }).join('');
}

function setCollectedFilter(f) {
  state.collectedFilter = f;
  renderCollected();
}

function toggleCollectedWritten(id) {
  const list = DB.getCollected();
  const c = list.find(x => x.id === id);
  if (!c) return;
  c.written = !c.written;
  c.writtenAt = c.written ? new Date().toISOString() : null;
  DB.saveCollected(list);
  renderCollected();
}

function writeFromCollected(id) {
  const list = DB.getCollected();
  const c = list.find(x => x.id === id);
  if (!c) return;
  createWorkFromPrompt(c.title, c.title);
  if (!c.written) {
    c.written = true;
    c.writtenAt = new Date().toISOString();
    DB.saveCollected(list);
  }
}

function editCollectedNote(id) {
  state.noteEditingId = id;
  const c = DB.getCollected().find(x => x.id === id);
  document.getElementById('note-input').value = c ? (c.note || '') : '';
  document.getElementById('note-modal-overlay').classList.add('show');
  setTimeout(() => document.getElementById('note-input').focus(), 80);
}

function closeNoteModal() {
  document.getElementById('note-modal-overlay').classList.remove('show');
  state.noteEditingId = null;
}

function saveCollectedNote() {
  const id = state.noteEditingId;
  if (!id) return;
  const list = DB.getCollected();
  const c = list.find(x => x.id === id);
  if (c) {
    c.note = document.getElementById('note-input').value.trim();
    DB.saveCollected(list);
  }
  closeNoteModal();
  renderCollected();
}

function deleteCollected(id) {
  showModal('删除收藏', '确定删除这条收藏？', () => {
    DB.saveCollected(DB.getCollected().filter(c => c.id !== id));
    renderCollected();
  });
}

// KEYBOARD SHORTCUTS (global)
// ============================================================
document.addEventListener('keydown', (e) => {
  // Escape to close modal
  if (e.key === 'Escape') closeModal();
});

// ============================================================
// ADDITIONAL STYLES FOR FILTER BTNS
// ============================================================
const styleExtra = document.createElement('style');
styleExtra.textContent = `
  .filter-btn { background: transparent; border-color: transparent; color: var(--text-secondary); }
  .filter-btn:hover { border-color: var(--border); background: var(--surface); }
  .filter-btn.active-filter { background: var(--surface); border-color: var(--accent); color: var(--text); }
`;
document.head.appendChild(styleExtra);

// ============================================================
// SAVE ON BEFOREUNLOAD
// ============================================================
window.addEventListener('beforeunload', () => {
  // Save current work if editing
  if (state.currentWorkId) {
    const works = DB.getWorks();
    const work = works.find(w => w.id === state.currentWorkId);
    if (work) {
      const title = document.getElementById('editor-title')?.value;
      const content = document.getElementById('editor-content')?.value;
      if (title !== undefined) work.title = title.trim() || '未命名';
      if (content !== undefined) work.content = content;
      work.updatedAt = new Date().toISOString();
      work.totalWritingTimeMs = state.timerAccumulated + (state.timerStartTime ? Date.now() - state.timerStartTime : 0);
      DB.saveWorks(works);
    }
  }
  // Save idea if editing
  if (state.currentIdeaId && document.getElementById('page-idea-editor').classList.contains('active')) {
    const works = DB.getWorks();
    const idea = works.find(w => w.id === state.currentIdeaId);
    if (idea) {
      idea.title = document.getElementById('idea-editor-title')?.value.trim() || '未命名灵感';
      idea.content = document.getElementById('idea-editor-content')?.value || '';
      idea.updatedAt = new Date().toISOString();
      DB.saveWorks(works);
    }
  }
});

// ============================================================
// PWA: Service Worker Registration + Install Prompt
// ============================================================
let installPrompt = null;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = '';
});

window.addEventListener('appinstalled', () => {
  installPrompt = null;
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'none';
});

function installApp() {
  if (!installPrompt) return;
  installPrompt.prompt();
  installPrompt.userChoice.then(() => { installPrompt = null; });
}

// ============================================================
// INIT
// ============================================================
migrateData();
const versionEl = document.getElementById('app-version');
if (versionEl) versionEl.textContent = APP_VERSION;
// Apply saved theme
setTheme(getTheme());
router();
</script>
