function togglePolishText() {
  polishState.textOpen = !polishState.textOpen;
  const wrap = document.getElementById('polish-text-wrap');
  const chev = document.getElementById('polish-text-chevron');
  if (wrap) wrap.style.display = polishState.textOpen ? 'block' : 'none';
  if (chev) chev.style.transform = polishState.textOpen ? 'rotate(180deg)' : '';
}

function onPolishTextInput() {
  updatePolishWordcount();
  updatePolishSelChip();
  const st = document.getElementById('polish-save-status');
  if (st) st.textContent = '保存中…';
  if (polishState.saveTimer) clearTimeout(polishState.saveTimer);
  polishState.saveTimer = setTimeout(savePolishText, 1500);
}

function savePolishText() {
  const w0 = polishWork();
  if (!w0) return;
  const ta = document.getElementById('polish-text');
  if (!ta) return;
  // 和编辑器同一个坑：绝不能拿进 await 之前那份 works 写回去，否则会冲掉这期间她打的字。
  // 重新读一次，只改这一篇的正文。
  const works = DB.getWorks();
  const w = works.find(x => x.id === w0.id);
  if (!w) return;
  w.content = ta.value;
  w.updatedAt = new Date().toISOString();
  DB.saveWorks(works);
  const st = document.getElementById('polish-save-status');
  if (st) st.textContent = '✓ 已保存';
  polishState.saveTimer = null;
}

function updatePolishWordcount() {
  const ta = document.getElementById('polish-text');
  const el = document.getElementById('polish-wordcount');
  if (el) el.textContent = countChars(ta ? ta.value : '') + ' 字';
}

/* ---- 「用选中的这段」 ---- */
function getPolishSelection() {
  const ta = document.getElementById('polish-text');
  if (!ta) return '';
  const s = ta.selectionStart, e = ta.selectionEnd;
  if (typeof s !== 'number' || typeof e !== 'number' || e <= s) return '';
  return ta.value.slice(s, e);
}
function updatePolishSelChip() {
  const chip = document.getElementById('polish-sel-chip');
  if (!chip) return;
  const sel = getPolishSelection();
  if (sel) {
    chip.textContent = '用选中的 ' + countChars(sel) + ' 字 ✕';
    chip.classList.add('on');
  } else {
    chip.textContent = '没选中（聊整篇）';
    chip.classList.remove('on');
  }
}
function usePolishSelection() {
  const ta = document.getElementById('polish-text');
  if (!ta) return;
  if (getPolishSelection()) {          // 已经选中了，点一下 = 取消
    ta.selectionStart = ta.selectionEnd = 0;
    updatePolishSelChip();
    return;
  }
  if (!polishState.textOpen) togglePolishText();   // 没选中就把原文摊开，让她去划
  ta.focus();
  toast('在原文里划一段，就说这一段');
}

/* ---- 对话渲染 ---- */
// 对话不是独立滚动区，整页会跟着长。她发完一条要是停在屏幕外，等于没回。
function polishScrollToBottom() {
  if (typeof window === 'undefined' || typeof window.scrollTo !== 'function') return;
  const h = document.body ? document.body.scrollHeight : 0;
  if (h > 0) window.scrollTo({ top: h, behavior: 'smooth' });
}

function renderPolishThread() {
  const box = document.getElementById('polish-thread');
  if (!box) return;
  const w = polishWork();
  if (!w) {
    box.innerHTML = '<div class="polish-empty">先去「作品」写一篇，再拿来改</div>';
    return;
  }
  const list = polishEntries();
  const name = polishEditorName();
  if (!list.length) {
    box.innerHTML = '<div class="polish-empty">还没聊过。<br>在下面说一句，或者直接问她「这篇怎么样」。</div>';
    return;
  }
  box.innerHTML = list.map((a, i) => polishBubbleYou(a) + polishBubbleHer(a, i, name)).join('');
  box.scrollTop = box.scrollHeight;
  polishScrollToBottom();
}

function polishBubbleYou(a) {
  const quoted = a.selection
    ? `<div class="polish-quote">${escapeHtml(clipText(a.selection, 140))}</div>`
    : '';
  const body = a.question
    ? escapeHtml(a.question)
    : (a.mode === 'selection' ? '（这段，你看看）' : '（整篇，你看看）');
  return `<div class="polish-row me"><div class="polish-bubble you">${quoted}<div class="polish-you-text">${body}</div></div></div>`;
}

function polishBubbleHer(a, i, name) {
  return `<div class="polish-row her">
      <div class="polish-avatar">✎</div>
      <div class="polish-bubble her">
        <div class="polish-who">${escapeHtml(name)} · ${formatDate(a.createdAt)}</div>
        <div class="ai-md">${renderMarkdown(a.result)}</div>
        <div class="polish-acts">
          <button class="polish-act" onclick="copyPolishAt(${i})">复制</button>
          <button class="polish-act del" onclick="deletePolishAt(${i})">删掉这一轮</button>
        </div>
      </div>
    </div>`;
}

function deletePolishAt(i) {
  const a = polishEntries()[i];
  const w0 = polishWork();
  if (!a || !w0) return;
  showModal('删掉这一轮', '你问的那句和她回的那段一起没。后面的还留着。', () => {
    const works = DB.getWorks();
    const w = works.find(x => x.id === w0.id);
    if (!w || !Array.isArray(w.analyses)) return;
    const target = w.analyses.find(x => x.id === a.id);
    if (!target) return;
    // 子节点重挂到被删节点的父级，否则后面的追问链会在这里断掉
    w.analyses = w.analyses
      .filter(x => x.id !== a.id)
      .map(x => x.parentId === a.id ? Object.assign({}, x, { parentId: target.parentId || null }) : x);
    DB.saveWorks(works);
    renderPolishThread();
    toast('删掉了');
  });
}

function clearPolishThread() {
  const w0 = polishWork();
  if (!w0) { toast('先选一篇'); return; }
  if (!polishEntries().length) { toast('本来就没有记录'); return; }
  showModal('清空记录', '这一篇的改文记录全部删掉。原文一个字都不动。', () => {
    const works = DB.getWorks();
    const w = works.find(x => x.id === w0.id);
    if (!w) return;
    w.analyses = [];
    DB.saveWorks(works);
    renderPolishThread();
    toast('记录清空了');
  });
}

function copyPolishAt(i) {
  const a = polishEntries()[i];
  if (!a || !a.result) return;
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(a.result).then(() => toast('复制了')).catch(() => toast('复制失败，手动选一下吧'));
  } else {
    toast('这个浏览器不支持自动复制');
  }
}

/* ---- 说话 ---- */
function appendPolishPending(text, sel) {
  const box = document.getElementById('polish-thread');
  if (!box) return;
  if (!box.querySelector('.polish-row')) box.innerHTML = '';
  const name = polishEditorName();
  const quoted = sel ? `<div class="polish-quote">${escapeHtml(clipText(sel, 140))}</div>` : '';
  box.insertAdjacentHTML('beforeend',
    `<div class="polish-row me"><div class="polish-bubble you">${quoted}<div class="polish-you-text">${escapeHtml(text)}</div></div></div>` +
    `<div class="polish-row her"><div class="polish-avatar">✎</div><div class="polish-bubble her">` +
    `<div class="polish-who">${escapeHtml(name)}</div><div class="polish-typing">正在读你的稿子……</div></div></div>`
  );
  box.scrollTop = box.scrollHeight;
  polishScrollToBottom();
}

async function sendPolish() {
  if (polishState.busy) return;
  const w0 = polishWork();
  if (!w0) { toast('先去「作品」写一篇吧'); return; }

  const inp = document.getElementById('polish-input');
  const text = (inp ? inp.value : '').trim();
  const list = polishEntries();
  if (list.length && !text) { toast('想说点什么？'); return; }
  if (!WriterAI.hasKey()) { toast('先在「我的」里填 API Key'); return; }

  const ta = document.getElementById('polish-text');
  const fullText = ta ? ta.value : (w0.content || '');
  if (!String(fullText).trim()) { toast('这一篇还是空的'); return; }
  // 把刚打的字立刻存下，免得 AI 这十几秒里她改的东西没落盘
  if (polishState.saveTimer) { clearTimeout(polishState.saveTimer); polishState.saveTimer = null; savePolishText(); }

  const sel = getPolishSelection();
  const workId = w0.id;
  const lastId = list.length ? list[list.length - 1].id : null;
  const mode = list.length ? (list[list.length - 1].mode || 'full') : (sel ? 'selection' : 'full');

  let messages;
  if (list.length) {
    messages = buildFollowupMessages(w0, lastId, text, fullText);
    if (!messages) { toast('记录对不上了，清空重来吧'); return; }
  } else {
    messages = buildReviewMessages(mode, fullText, sel, text);
  }

  polishState.busy = true;
  const btn = document.getElementById('polish-send');
  if (btn) { btn.disabled = true; btn.textContent = '…'; }
  if (inp) inp.value = '';
  appendPolishPending(text || (mode === 'selection' ? '（这段，你看看）' : '（整篇，你看看）'), sel);

  try {
    const result = await WriterAI.chat(messages);

    // ↓↓↓ 这一整段必须同步，而且必须重新读一次 works。
    // AI 请求要十几秒，期间她的每次输入都会触发存盘；拿进 await 之前那份写回去，
    // 会把这十几秒里她打的字全部冲掉。
    const works = DB.getWorks();
    const w = works.find(x => x.id === workId);
    if (!w) throw new Error('这篇稿子已经不在了，结果没能存下');

    const entry = {
      id: DB.genId(),
      parentId: lastId,
      createdAt: new Date().toISOString(),
      mode: mode,
      selection: list.length ? '' : sel,
      question: text,
      result: result,
    };
    w.analyses = (w.analyses || []).concat([entry]);
    DB.saveWorks(works);
    renderPolishThread();
  } catch (err) {
    renderPolishThread();
    const box = document.getElementById('polish-thread');
    if (box) {
      box.insertAdjacentHTML('beforeend',
        '<div class="polish-row her"><div class="polish-avatar">!</div>' +
        '<div class="polish-bubble her polish-err">' + escapeHtml(err.message) + '</div></div>');
      box.scrollTop = box.scrollHeight;
    }
  } finally {
    polishState.busy = false;
    if (btn) { btn.disabled = false; btn.textContent = '说'; }
    updatePolishSelChip();
  }
}

// 改文页那个编辑的名字。空着就回到默认的「阿笺」——聊天记录里存的是名字不是 ID，

  DB.saveSettings(s);
  toast(s.editorName ? '记下了，她以后叫' + s.editorName : '回到默认的「' + POLISH_DEFAULT_NAME + '」');

}

async function testAIConnection() {
  const btn = document.getElementById('btn-test-ai');
  if (!btn || btn.disabled) return;
  saveAIConfig();
  const orig = btn.textContent;
  btn.disabled = true;
  btn.textContent = '测试中…';
  try {
    await WriterAI.chat([{ role: 'user', content: '只回一个字：好' }], 20000);
    toast('连接正常');
  } catch (err) {
    toast(err.message);
  } finally {
    btn.disabled = false;
    btn.textContent = orig;
  }
}

// ---------- 数据备份 ----------
function exportAllData() {
  const dump = {
    app: '笔间',
    version: APP_VERSION,
    exportedAt: new Date().toISOString(),
    works: DB.getWorks(),
    prompts: DB.getPrompts(),
    hidden: DB.getHidden(),
    collected: DB.getCollected(),
    settings: DB.getSettings(),
  };
  const blob = new Blob([JSON.stringify(dump, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '笔间备份-' + new Date().toISOString().slice(0, 10) + '.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  toast('备份已导出');
}

function importAllData() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json,application/json';
  input.onchange = () => {
    const file = input.files && input.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      let dump;
      try { dump = JSON.parse(reader.result); } catch (e) { toast('这个文件读不出来'); return; }
      if (!dump || !Array.isArray(dump.works)) { toast('不是笔间的备份文件'); return; }
      const nowCount = DB.getWorks().length;
      showModal(
        '导入备份',
        `会覆盖现在的 ${nowCount} 条内容，换成备份里的 ${dump.works.length} 条。确定吗？`,
        () => {
          // 导入不走 migrateData()，这里必须自己兜底，否则老备份进来后 .analyses 会直接抛错
          DB.saveWorks(dump.works.map(w => ({
            ...w,
            tags: Array.isArray(w.tags) ? w.tags : [],
            analyses: Array.isArray(w.analyses) ? w.analyses : [],
          })));
          if (Array.isArray(dump.prompts)) DB.savePrompts(dump.prompts);
          if (Array.isArray(dump.hidden)) DB.saveHidden(dump.hidden);
          if (Array.isArray(dump.collected)) DB.saveCollected(dump.collected);
          if (dump.settings) DB.saveSettings(dump.settings);
          toast('导入完成');
          navigate('works');
        },
        '确定导入'
      );
    };
    reader.readAsText(file);
  };
  input.click();
}

function toast(msg) {
  let el = document.getElementById('app-toast');
  if (!el) {
    el = document.createElement('div');
    el.id = 'app-toast';
    el.style.cssText = 'position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(29,29,31,.85);color:#fff;padding:8px 18px;border-radius:20px;font-size:.82rem;z-index:300;transition:opacity .3s;pointer-events:none;max-width:80vw;';
    document.body.appendChild(el);
  }
  el.textContent = msg;
  el.style.opacity = '1';
  clearTimeout(el._t);
  el._t = setTimeout(() => { el.style.opacity = '0'; }, 1800);
}

function createWorkFromPrompt(title, intro) {
  const works = DB.getWorks();
  const work = makeWork('novel', {
    title: title || '未命名',
    content: intro ? `梗 · ${intro}\n\n` : '',
  });
  works.push(work);
  DB.saveWorks(works);
  navigate('editor', 'id=' + work.id);
}

function collectItem(entry) {
  const collected = DB.getCollected();
  collected.unshift(normalizeCollected({
    id: DB.genId(),
    title: entry.title || entry.keyword || '未命名',
    combo: entry.combo || null,
    keyword: entry.keyword || null,
    source: entry.source || 'draw',
    champion: !!entry.champion,
    createdAt: new Date().toISOString(),
  }));
  DB.saveCollected(collected);
  toast('已加入收藏');
}

// ---------- 页面与 Tab ----------
function renderPromptsPage() {
  document.getElementById('prompts-count').textContent = '题库 ' + getAllPrompts().length;
  document.querySelectorAll('#prompts-tabs .tab-btn').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.tab === state.promptsTab);
  });
  document.querySelectorAll('#page-prompts .tab-panel').forEach(panel => {
    panel.classList.toggle('active', panel.dataset.panel === state.promptsTab);
  });
  if (state.promptsTab === 'draw') renderDrawPanel();
  else if (state.promptsTab === 'pool') renderPool();
  else if (state.promptsTab === 'collected') renderCollected();
}

function setPromptsTab(tab) {
  state.promptsTab = tab;
  renderPromptsPage();
}

// ---------- 抽签（组合抽） ----------
function renderDrawPanel() {
  if (!state.drawCats) {
    state.drawCats = {};
    CATEGORIES.forEach(c => state.drawCats[c.key] = true);
  }
  renderDrawCats();
  if (state.combo) renderCombo();
  updateDrawActions();
}

function renderDrawCats() {
  const el = document.getElementById('draw-cats');
  el.innerHTML = CATEGORIES.map(c => {
    const on = state.drawCats[c.key];
    return `<button class="cat-chip ${on ? 'active' : ''}" onclick="toggleDrawCat('${c.key}')">${c.key}</button>`;
  }).join('');
}

function toggleDrawCat(cat) {
  state.drawCats[cat] = !state.drawCats[cat];
  if (!Object.values(state.drawCats).some(Boolean)) state.drawCats[cat] = true;
  renderDrawCats();
  state.combo = null;
  state.comboSelected = false;
  renderCombo();
  updateDrawActions();
}

function doDraw() {
  const cats = CATEGORIES.filter(c => state.drawCats[c.key]);
  if (cats.length === 0) { toast('先勾选至少一个维度'); return; }
  const combo = {};
  cats.forEach(c => {
    const pool = getPromptsByCategory(c.key);
    if (pool.length > 0) combo[c.key] = pickRandomN(pool, 1)[0].keyword;
  });
  if (Object.keys(combo).length === 0) { toast('题库空了，先去题库加几个文梗'); return; }
  state.combo = combo;
  state.comboSelected = false;
  renderCombo();
  updateDrawActions();
}

function redraw() { doDraw(); }

function renderCombo() {
  const area = document.getElementById('combo-area');
  if (!state.combo) { area.innerHTML = ''; return; }
  const rows = CATEGORIES.filter(c => state.combo[c.key]).map(c => `
    <div class="cc-row">
      <div class="cc-cat">${c.key}</div>
      <div class="cc-word">${escapeHtml(state.combo[c.key])}</div>
    </div>`).join('');
  area.innerHTML = `<div class="combo-card ${state.comboSelected ? 'selected' : ''}" onclick="selectCombo()">${rows}</div>`;
}

function selectCombo() {
  if (!state.combo) return;
  state.comboSelected = !state.comboSelected;
  renderCombo();
  updateDrawActions();
}

function comboTitle() {
  if (!state.combo) return '';
  return Object.values(state.combo).join(' × ');
}

function updateDrawActions() {
  document.getElementById('btn-redraw').style.display = state.combo ? '' : 'none';
  document.getElementById('draw-actions').style.display = (state.combo && state.comboSelected) ? '' : 'none';
}

function collectCombo() {
  if (!state.combo) return;
  collectItem({ title: comboTitle(), combo: Object.assign({}, state.combo), source: 'draw' });
}

function writeFromCombo() {
  if (!state.combo) return;
  createWorkFromPrompt(comboTitle(), comboTitle());
}

// ---------- 题库 ----------
function renderPool() {
  const search = ((document.getElementById('pool-search') || {}).value || '').trim();
  const hidden = DB.getHidden();
  const customs = DB.getPrompts().filter(p => p.keyword.includes(search));
  const builtins = BUILTIN_TROPES.filter(p => p.keyword.includes(search));
  const shown = builtins.filter(p => !hidden.includes(p.keyword));
  const hiddens = builtins.filter(p => hidden.includes(p.keyword));

  let html = '';
  html += `<div class="pool-section-title"><h3>我的文梗（${customs.length}）</h3></div>`;
  if (customs.length === 0) {
    html += `<div class="empty-state" style="padding:20px 16px;"><div class="empty-text">还没有自定义文梗，点「+ 新增文梗」加一个</div></div>`;
  } else {
    html += customs.map(p => `
      <div class="pool-item">
        <span class="tag custom">我的</span>
        <span class="pi-kw">${escapeHtml(p.keyword)}</span>
        <span class="tag">${escapeHtml(p.category)}</span>
        <span class="pi-actions">
          <button class="btn btn-sm btn-ghost" onclick="openPromptEditor('${p.id}')">编辑</button>
          <button class="btn btn-sm btn-ghost" style="color:var(--text-tertiary)" onclick="deletePrompt('${p.id}')">删除</button>
        </span>
      </div>`).join('');
  }
  html += `<div class="pool-section-title"><h3>内置题库（${shown.length}）</h3></div>`;
  html += shown.map(p => `
    <div class="pool-item">
      <span class="tag">内置</span>
      <span class="pi-kw">${escapeHtml(p.keyword)}</span>
      <span class="tag">${escapeHtml(p.category)}</span>
      <span class="pi-actions">
        <button class="btn btn-sm btn-ghost" onclick="toggleHidePrompt('${p.keyword}')">隐藏</button>
      </span>
    </div>`).join('');
  if (state.showHidden && hiddens.length > 0) {
    html += `<div class="pool-section-title"><h3>已隐藏（${hiddens.length}）</h3></div>`;
    html += hiddens.map(p => `
      <div class="pool-item">
        <span class="tag">内置</span>
        <span class="pi-kw pi-hidden-kw">${escapeHtml(p.keyword)}</span>
        <span class="pi-actions">
          <button class="btn btn-sm btn-ghost" onclick="toggleHidePrompt('${p.keyword}')">恢复</button>
        </span>
      </div>`).join('');
  }
  document.getElementById('pool-list').innerHTML = html;
  document.getElementById('btn-show-hidden').textContent = state.showHidden ? '收起已隐藏' : '显示已隐藏';
}

function toggleShowHidden() {
  state.showHidden = !state.showHidden;
  renderPool();
}

function toggleHidePrompt(keyword) {
  const hidden = DB.getHidden();
  if (hidden.includes(keyword)) DB.saveHidden(hidden.filter(k => k !== keyword));
  else DB.saveHidden([...hidden, keyword]);
  renderPool();
  document.getElementById('prompts-count').textContent = '题库 ' + getAllPrompts().length;
}

function openPromptEditor(id) {
  state.editingPromptId = id || null;
  const sel = document.getElementById('prompt-category');
  sel.innerHTML = CATEGORIES.map(c => `<option value="${c.key}">${c.key}</option>`).join('');
  const kw = document.getElementById('prompt-keyword');
  if (id) {
    const p = DB.getPrompts().find(x => x.id === id);
    if (p) {
      document.getElementById('prompt-modal-title').textContent = '编辑文梗';
      kw.value = p.keyword;
      sel.value = p.category;
    }
  } else {
    document.getElementById('prompt-modal-title').textContent = '新增文梗';
    kw.value = '';
    sel.value = CATEGORIES[0].key;
  }
  document.getElementById('prompt-modal-overlay').classList.add('show');
  setTimeout(() => kw.focus(), 80);
}

function closePromptModal() {
  document.getElementById('prompt-modal-overlay').classList.remove('show');
  state.editingPromptId = null;
}

function savePrompt() {
  const kw = document.getElementById('prompt-keyword').value.trim();
  const cat = document.getElementById('prompt-category').value;
  if (!kw) { toast('关键词不能为空'); return; }
  const editing = state.editingPromptId;
  const dup = getAllPrompts().find(p => p.keyword === kw && p.id !== editing);
  if (dup) {
    showModal('重复了', `题库里已有「${dup.keyword}」，还要添加吗？`, () => { savePromptForce(kw, cat, editing); });
    return;
  }
  savePromptForce(kw, cat, editing);
}

function savePromptForce(kw, cat, editing) {
  const prompts = DB.getPrompts();
  if (editing) {
    const p = prompts.find(x => x.id === editing);
    if (p) { p.keyword = kw; p.category = cat; p.updatedAt = new Date().toISOString(); }
  } else {
    prompts.push({ id: DB.genId(), keyword: kw, category: cat, createdAt: new Date().toISOString() });
  }
  DB.savePrompts(prompts);
  closePromptModal();
  renderPool();
  document.getElementById('prompts-count').textContent = '题库 ' + getAllPrompts().length;
  toast(editing ? '已更新' : '已新增');
}

function deletePrompt(id) {
  showModal('删除文梗', '确定删除这个自定义文梗？', () => {
    DB.savePrompts(DB.getPrompts().filter(p => p.id !== id));
    renderPool();
    document.getElementById('prompts-count').textContent = '题库 ' + getAllPrompts().length;
  });
}

// ---------- 收藏 ----------
function renderCollected() {
  const all = DB.getCollected();
  const written = all.filter(c => c.written).length;
  document.getElementById('collected-stats').innerHTML =
    `<span>共 <b>${all.length}</b></span><span>已写 <b>${written}</b></span><span>未写 <b>${all.length - written}</b></span>`;
  document.querySelectorAll('#page-prompts [data-panel="collected"] .filter-btn').forEach(btn => {
    btn.classList.toggle('active-filter', btn.dataset.f === state.collectedFilter);
  });
  const list = all.filter(c => {
    if (state.collectedFilter === 'written') return c.written;
    if (state.collectedFilter === 'unwritten') return !c.written;
    return true;
  });
  const el = document.getElementById('collected-list');
  if (list.length === 0) {
    el.innerHTML = `<div class="empty-state"><div class="empty-text">还没有收藏的文梗，去抽一题或打一场吧</div></div>`;
    return;
  }
  el.innerHTML = list.map(c => {
    const badge = c.source === 'battle' ? (c.champion ? '对决 · 冠军' : '对决') : '抽签';
    return `
    <div class="collected-card">
      <div class="cc-top">
        <span class="cc-title ${c.written ? 'written' : ''}">${escapeHtml(c.title)}</span>
        <span class="tag ${c.written ? '' : 'custom'}">${c.written ? '已写' : '未写'}</span>
      </div>
      <div class="cc-meta">
        <span>${badge}</span>
        <span>${formatDate(c.createdAt)}</span>
      </div>
      ${c.note ? `<div class="cc-note">${escapeHtml(c.note)}</div>` : ''}
      <div class="cc-actions">
        <button class="btn btn-sm btn-primary" onclick="writeFromCollected('${c.id}')">开写</button>
        <button class="btn btn-sm" onclick="toggleCollectedWritten('${c.id}')">${c.written ? '标记未写' : '标记已写'}</button>
        <button class="btn btn-sm" onclick="editCollectedNote('${c.id}')">${c.note ? '改备注' : '加备注'}</button>
        <button class="btn btn-sm" style="color:var(--text-tertiary)" onclick="deleteCollected('${c.id}')">删除</button>
      </div>
    </div>`;
  }).join('');
}

function setCollectedFilter(f) {
  state.collectedFilter = f;
  renderCollected();
}

function toggleCollectedWritten(id) {
  const list = DB.getCollected();
  const c = list.find(x => x.id === id);
  if (!c) return;
  c.written = !c.written;
  c.writtenAt = c.written ? new Date().toISOString() : null;
  DB.saveCollected(list);
  renderCollected();
}

function writeFromCollected(id) {
  const list = DB.getCollected();
  const c = list.find(x => x.id === id);
  if (!c) return;
  createWorkFromPrompt(c.title, c.title);
  if (!c.written) {
    c.written = true;
    c.writtenAt = new Date().toISOString();
    DB.saveCollected(list);
  }
}

function editCollectedNote(id) {
  state.noteEditingId = id;
  const c = DB.getCollected().find(x => x.id === id);
  document.getElementById('note-input').value = c ? (c.note || '') : '';
  document.getElementById('note-modal-overlay').classList.add('show');
  setTimeout(() => document.getElementById('note-input').focus(), 80);
}

function closeNoteModal() {
  document.getElementById('note-modal-overlay').classList.remove('show');
  state.noteEditingId = null;
}

function saveCollectedNote() {
  const id = state.noteEditingId;
  if (!id) return;
  const list = DB.getCollected();
  const c = list.find(x => x.id === id);
  if (c) {
    c.note = document.getElementById('note-input').value.trim();
    DB.saveCollected(list);
  }
  closeNoteModal();
  renderCollected();
}

function deleteCollected(id) {
  showModal('删除收藏', '确定删除这条收藏？', () => {
    DB.saveCollected(DB.getCollected().filter(c => c.id !== id));
    renderCollected();
  });
}

// ============================================================
// KEYBOARD SHORTCUTS (global)
// ============================================================
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  closeModal();
});

// ============================================================
// ADDITIONAL STYLES FOR FILTER BTNS
// ============================================================
const styleExtra = document.createElement('style');
styleExtra.textContent = `
  .filter-btn { background: transparent; border-color: transparent; color: var(--text-secondary); }
  .filter-btn:hover { border-color: var(--border); background: var(--surface); }
  .filter-btn.active-filter { background: var(--surface); border-color: var(--accent); color: var(--text); }
`;
document.head.appendChild(styleExtra);

// ============================================================
// SAVE ON BEFOREUNLOAD
// ============================================================
window.addEventListener('beforeunload', () => {
  // Save current work if editing
  if (state.currentWorkId) {
    const works = DB.getWorks();
    const work = works.find(w => w.id === state.currentWorkId);
    if (work) {
      const title = document.getElementById('editor-title')?.value;
      const content = document.getElementById('editor-content')?.value;
      if (title !== undefined) work.title = title.trim() || '未命名';
      if (content !== undefined) work.content = content;
      work.updatedAt = new Date().toISOString();
      work.totalWritingTimeMs = state.timerAccumulated + (state.timerStartTime ? Date.now() - state.timerStartTime : 0);
      DB.saveWorks(works);
    }
  }
  // Save idea if editing
  if (state.currentIdeaId && document.getElementById('page-idea-editor').classList.contains('active')) {
    const works = DB.getWorks();
    const idea = works.find(w => w.id === state.currentIdeaId);
    if (idea) {
      idea.title = document.getElementById('idea-editor-title')?.value.trim() || '未命名灵感';
      idea.content = document.getElementById('idea-editor-content')?.value || '';
      idea.updatedAt = new Date().toISOString();
      DB.saveWorks(works);
    }
  }
});

// ============================================================
// PWA: Service Worker Registration + Install Prompt
// ============================================================
let installPrompt = null;

if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}

window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  installPrompt = e;
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = '';
});

window.addEventListener('appinstalled', () => {
  installPrompt = null;
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'none';
});

function installApp() {
  if (!installPrompt) return;
  installPrompt.prompt();
  installPrompt.userChoice.then(() => { installPrompt = null; });
}

// ============================================================
// INIT
// ============================================================
migrateData();
const versionEl = document.getElementById('app-version');
if (versionEl) versionEl.textContent = APP_VERSION;
// Apply saved theme
setTheme(getTheme());
router();
</script>
</body>
