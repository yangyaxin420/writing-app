<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>笔间</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#c4a882">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="写页面">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* ===== Reset & Base ===== */
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
html { font-size: 16px; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Noto Sans SC", "Microsoft YaHei", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

/* ===== Variables / Themes ===== */
:root {
  --bg: #f8f6f3;
  --surface: #ffffff;
  --surface-alt: #f4f1ec;
  --border: #e8e4de;
  --border-light: #f0ede8;
  --text: #1d1d1f;
  --text-secondary: #8e8e93;
  --text-tertiary: #bbb7b0;
  --accent: #c4a882;
  --accent-hover: #b89b72;
  --accent-light: #f0e8de;
  --shadow: 0 1px 3px rgba(0,0,0,0.04);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.08);
  --radius: 10px;
  --radius-sm: 6px;
  --transition: 0.2s ease;
}

/* Theme: 晴空 */
[data-theme="sky"] {
  --bg: #f0f8ff;
  --surface: #ffffff;
  --surface-alt: #e6f3fa;
  --border: #d0e4f0;
  --border-light: #e6f3fa;
  --text-secondary: #7a9eb5;
  --text-tertiary: #a8c4d8;
  --accent: #bae6fb;
  --accent-hover: #7dd3fc;
  --accent-light: #e0f2fe;
}
/* Theme: 薄荷 */
[data-theme="mint"] {
  --bg: #f0fdf4;
  --surface: #ffffff;
  --surface-alt: #e6f5ea;
  --border: #c8e0d0;
  --border-light: #e0f0e4;
  --text-secondary: #78a088;
  --text-tertiary: #a0c0ac;
  --accent: #86cfa3;
  --accent-hover: #5cb87a;
  --accent-light: #dcfce7;
}
/* Theme: 奶油 */
[data-theme="cream"] {
  --bg: #fefceb;
  --surface: #ffffff;
  --surface-alt: #f8f3d8;
  --border: #e8e2c8;
  --border-light: #f2ecd0;
  --text-secondary: #a09870;
  --text-tertiary: #c0b898;
  --accent: #fde68a;
  --accent-hover: #fcd34d;
  --accent-light: #fef9c3;
}
/* Theme: 纯白 */
[data-theme="white"] {
  --bg: #fafafa;
  --surface: #ffffff;
  --surface-alt: #f0f0f0;
  --border: #e0e0e0;
  --border-light: #f0f0f0;
  --text-secondary: #9e9e9e;
  --text-tertiary: #c0c0c0;
  --accent: #d0d0d0;
  --accent-hover: #b0b0b0;
  --accent-light: #f0f0f0;
}

/* Theme: 暮色 (柔和暗色) */
[data-theme="dusk"] {
  --bg: #3a3835;
  --surface: #454240;
  --surface-alt: #4e4b48;
  --border: #5a5754;
  --border-light: #4e4b48;
  --text: #e0ddda;
  --text-secondary: #a8a5a0;
  --text-tertiary: #807d78;
  --accent: #c4a882;
  --accent-hover: #d4b892;
  --accent-light: #4a4540;
  --shadow: 0 1px 3px rgba(0,0,0,0.15);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.25);
}
/* Theme: 夜蓝 (柔和暗色) */
[data-theme="navy"] {
  --bg: #2d3748;
  --surface: #3a4556;
  --surface-alt: #434e5e;
  --border: #4e5968;
  --border-light: #434e5e;
  --text: #e2e8f0;
  --text-secondary: #a0aec0;
  --text-tertiary: #7a8898;
  --accent: #7dd3fc;
  --accent-hover: #38bdf8;
  --accent-light: #3a4860;
  --shadow: 0 1px 3px rgba(0,0,0,0.15);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.25);
}
/* Theme: 雾灰 (柔和暗色) */
[data-theme="charcoal"] {
  --bg: #2a2a2a;
  --surface: #363636;
  --surface-alt: #404040;
  --border: #4a4a4a;
  --border-light: #404040;
  --text: #e0e0e0;
  --text-secondary: #9e9e9e;
  --text-tertiary: #787878;
  --accent: #b0b0b0;
  --accent-hover: #cccccc;
  --accent-light: #3a3a3a;
  --shadow: 0 1px 3px rgba(0,0,0,0.15);
  --shadow-hover: 0 4px 12px rgba(0,0,0,0.25);
}

/* ===== Typography ===== */
h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.02em; }
h2 { font-size: 1.15rem; font-weight: 600; }
h3 { font-size: 0.95rem; font-weight: 500; color: var(--text-secondary); }
a { color: inherit; text-decoration: none; }

/* ===== Layout ===== */
/* 底部留出固定导航栏的高度，否则内容会被压住 */
#app { max-width: 720px; margin: 0 auto; padding: 0 20px calc(72px + env(safe-area-inset-bottom)); min-height: 100vh; }

/* ===== Header ===== */
header {
  display: flex; align-items: center; justify-content: space-between;
  padding: 20px 0 16px; border-bottom: 1px solid var(--border); margin-bottom: 24px;
}
header .back {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.9rem; color: var(--text-secondary); cursor: pointer;
  background: none; border: none; padding: 4px 0;
  transition: color var(--transition);
}
header .back:hover { color: var(--text); }
header .title { display: flex; flex-direction: column; align-items: flex-start; gap: 6px; }
header .title .t-name { font-size: 1.15rem; font-weight: 600; line-height: 1.1; }
header .actions { display: flex; gap: 12px; align-items: center; }

/* ===== Pages ===== */
.page { display: none; animation: fadeIn 0.25s ease; }
.page.active { display: block; }
@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ===== 底部导航 ===== */
.bnav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 720px; z-index: 50;
  display: flex; background: var(--surface);
  border-top: 1px solid var(--border);
  padding-bottom: env(safe-area-inset-bottom);
}
.bnav.hidden { display: none; }
.bnav-item {
  flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
  padding: 8px 0 7px; border: none; background: none; cursor: pointer;
  color: var(--text-tertiary); font-size: .66rem; font-family: inherit;
  transition: color var(--transition); letter-spacing: .05em;
}
.bnav-item svg { width: 19px; height: 19px; }
.bnav-item.active { color: var(--accent); }

/* ===== 我的 ===== */
.me-card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); padding: 16px; margin-bottom: 20px;
}
.me-row { margin-bottom: 12px; }
.me-row:last-child { margin-bottom: 0; }
.me-label { display: block; font-size: .76rem; color: var(--text-secondary); margin-bottom: 6px; }
.me-input {
  width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: .86rem; font-family: inherit; background: var(--surface); color: var(--text); outline: none;
}
.me-input:focus { border-color: var(--accent); }
.me-hint { font-size: .74rem; color: var(--text-tertiary); line-height: 1.65; margin-top: 10px; }
.input-with-btn { display: flex; gap: 8px; align-items: center; }
.input-with-btn .me-input { flex: 1; min-width: 0; }
.input-with-btn .btn { flex-shrink: 0; }

/* ===== 改文页（对话） ===== */
.polish-pick { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.polish-pick-label { font-size: .8rem; color: var(--text-tertiary); flex-shrink: 0; }
.polish-select { flex: 1; min-width: 0; }

.polish-text-head {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding: 10px 14px; background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius); font-size: .86rem; font-weight: 600; cursor: pointer;
  transition: border-color var(--transition);
}
.polish-text-head:hover { border-color: var(--accent); }
.polish-text-meta { font-size: .72rem; color: var(--text-tertiary); font-weight: 400; }
#polish-text-chevron { display: inline-block; transition: transform var(--transition); }
.polish-textarea {
  width: 100%; min-height: 220px; margin-top: 8px; padding: 14px;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text); font-family: inherit;
  font-size: .9rem; line-height: 1.9; resize: vertical;
}
.polish-textarea:focus { outline: none; border-color: var(--accent); }
.polish-text-foot { display: flex; justify-content: space-between; font-size: .72rem; color: var(--text-tertiary); padding: 4px 2px 0; }
#polish-save-status { color: var(--accent); }

.polish-thread { display: flex; flex-direction: column; gap: 14px; padding: 18px 0 4px; }
.polish-empty { text-align: center; color: var(--text-tertiary); font-size: .82rem; line-height: 1.9; padding: 40px 16px; }
.polish-row { display: flex; gap: 8px; align-items: flex-start; }
.polish-row.me { justify-content: flex-end; }
.polish-avatar {
  width: 26px; height: 26px; border-radius: 50%; flex-shrink: 0; margin-top: 2px;
  background: var(--accent-light); color: var(--text);
  display: flex; align-items: center; justify-content: center; font-size: .78rem;
}
.polish-bubble { max-width: 84%; padding: 10px 14px; font-size: .88rem; line-height: 1.8; }
.polish-bubble.you {
  background: var(--accent-light); color: var(--text); word-break: break-word;
  border-radius: var(--radius) var(--radius) 4px var(--radius);
}
.polish-bubble.her {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius) var(--radius) var(--radius) 4px;
}
.polish-you-text { white-space: pre-wrap; }
.polish-quote {
  font-size: .76rem; color: var(--text-secondary); background: var(--bg);
  border-left: 2px solid var(--accent); padding: 6px 10px; border-radius: 0 4px 4px 0;
  margin-bottom: 8px; white-space: pre-wrap;
}
.polish-who { font-size: .7rem; color: var(--text-tertiary); margin-bottom: 6px; }
.polish-typing { font-size: .84rem; color: var(--text-tertiary); }
.polish-err { color: #c44; }
.polish-acts { display: flex; gap: 14px; margin-top: 10px; }
.polish-act {
  border: none; background: none; padding: 0; font-family: inherit;
  font-size: .72rem; color: var(--text-tertiary); cursor: pointer; transition: color var(--transition);
}
.polish-act:hover { color: var(--text); }
.polish-act.del:hover { color: #e05252; }

/* 输入框跟着走：一条条聊下去以后，她不该每次往下翻半页才能说话。
   bottom 让开底部导航（差不多 58px 高，再算上刘海屏的安全区）。 */
.polish-bar {
  display: flex; gap: 8px; align-items: center;
  position: sticky; bottom: calc(58px + env(safe-area-inset-bottom)); z-index: 40;
  margin-top: 14px; padding: 10px 0;
  background: var(--bg);
}
.polish-sel-chip {
  flex-shrink: 0; max-width: 42%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  border: 1px solid var(--border); background: var(--surface); color: var(--text-tertiary);
  font-family: inherit; font-size: .72rem; padding: 8px 11px; border-radius: 999px; cursor: pointer;
  transition: all var(--transition);
}
.polish-sel-chip.on { border-color: var(--accent); color: var(--text); background: var(--accent-light); }
.polish-input {
  flex: 1; min-width: 0; padding: 10px 12px; border: 1px solid var(--border);
  border-radius: var(--radius); background: var(--surface); color: var(--text);
  font-family: inherit; font-size: .88rem;
}
.polish-input:focus { outline: none; border-color: var(--accent); }

/* 结果排版（对话气泡里的正文） */
.ai-md { font-size: .88rem; line-height: 1.85; color: var(--text); }
.ai-md h3, .ai-md h4, .ai-md h5 { font-size: .92rem; margin: 16px 0 8px; font-weight: 600; }
.ai-md h3:first-child, .ai-md h4:first-child, .ai-md h5:first-child { margin-top: 0; }
.ai-md p { margin: 0 0 10px; }
.ai-md p:last-child { margin-bottom: 0; }
.ai-md ul { margin: 0 0 10px; padding-left: 20px; }
.ai-md li { margin-bottom: 5px; }
.ai-md blockquote {
  margin: 0 0 10px; padding: 6px 12px; border-left: 2px solid var(--accent);
  color: var(--text-secondary); background: var(--surface-alt);
  border-radius: 0 var(--radius-sm) var(--radius-sm) 0;
}
.ai-md code {
  background: var(--surface-alt); padding: 1px 5px; border-radius: 4px;
  font-size: .84em; font-family: ui-monospace, Menlo, monospace;
}
.ai-md strong { font-weight: 600; }

/* ===== Stats Bar (compact) ===== */
.stats-bar {
  display: flex; gap: 4px; margin-bottom: 16px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 9px 6px 5px;
  justify-content: space-around;
}
.stat-item {
  display: flex; flex-direction: column; justify-content: flex-end; align-items: center;
  text-align: center; cursor: pointer; transition: all var(--transition);
  padding: 2px 8px; border-radius: 4px; flex: 1;
}
.stat-item:hover { background: var(--surface-alt); }
.stat-item .si-value { font-size: 0.92rem; font-weight: 600; letter-spacing: -0.01em; line-height: 1.1; }
.stat-item .si-label { font-size: 0.68rem; color: var(--text-secondary); letter-spacing: 0.02em; margin-top: 3px; }

/* ===== Theme Switcher Dots ===== */
.theme-dots { display: flex; gap: 5px; align-items: center; }
.theme-dot {
  width: 14px; height: 14px; border-radius: 50%; cursor: pointer;
  border: 1.5px solid var(--border); transition: all var(--transition);
  flex-shrink: 0;
}
.theme-dot:hover { transform: scale(1.25); }
.theme-dot.active { border-color: var(--text); box-shadow: 0 0 0 1.5px var(--text); }

/* ===== Section Header ===== */
.section-header {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 14px; padding-top: 4px;
}
.section-header h2 { font-size: 1rem; color: var(--text-secondary); font-weight: 500; }

/* ===== Buttons ===== */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 8px 18px; border-radius: var(--radius-sm);
  font-size: 0.9rem; font-weight: 500; cursor: pointer; border: none;
  transition: all var(--transition); background: var(--surface); color: var(--text);
  border: 1px solid var(--border);
}
.btn:hover { border-color: var(--accent); background: var(--accent-light); }
.btn-primary {
  background: var(--accent); color: #fff; border-color: var(--accent);
}
.btn-primary:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
.btn-sm { padding: 5px 12px; font-size: 0.82rem; }
.btn-ghost { background: transparent; border-color: transparent; padding: 6px 10px; }
.btn-ghost:hover { background: var(--surface-alt); border-color: var(--border); }
.btn-danger { color: #c44; border-color: #f0d8d8; }
.btn-danger:hover { background: #fdf0f0; border-color: #c44; }
.btn-group { display: flex; gap: 8px; flex-wrap: wrap; }

/* ===== Quick Actions ===== */
.quick-actions { display: flex; gap: 8px; margin-bottom: 24px; }
.quick-actions .btn { flex: 1; justify-content: center; padding: 8px 12px; font-size: 0.82rem; }

/* ===== Recent List ===== */
.recent-list { margin-bottom: 32px; }
.recent-item {
  display: flex; align-items: center; justify-content: space-between;
  padding: 12px 14px; border-radius: var(--radius-sm);
  cursor: pointer; transition: background var(--transition);
  border-bottom: 1px solid var(--border-light);
}
.recent-item:last-child { border-bottom: none; }
.recent-item:hover { background: var(--surface-alt); }
.recent-item .ri-title { font-size: 0.93rem; font-weight: 500; }
.recent-item .ri-meta { font-size: 0.78rem; color: var(--text-tertiary); }

/* ===== Cards Grid ===== */
.card-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 24px; }
.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px 14px; cursor: pointer; transition: all var(--transition); position: relative;
}
.card:hover { box-shadow: var(--shadow-hover); border-color: var(--accent); }
.card .card-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 4px; }
.card .card-type {
  font-size: 0.72rem; color: var(--accent);
}
.card .card-meta { font-size: 0.75rem; color: var(--text-tertiary); }
.card .card-excerpt { font-size: 0.8rem; color: var(--text-secondary); margin-bottom: 6px; line-height: 1.5; display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden; }
.card .card-footer {
  display: flex; align-items: center; gap: 8px; margin-top: 4px;
  font-size: 0.75rem; color: var(--text-tertiary);
}
.card .card-footer .cf-divider { color: var(--text-tertiary); opacity: 0.3; }
.card .card-delete {
  position: absolute; top: 10px; right: 12px;
  font-size: 0.75rem; color: var(--text-tertiary); cursor: pointer;
  background: none; border: none; padding: 2px 6px; border-radius: 4px;
  opacity: 0; transition: opacity var(--transition);
}
.card:hover .card-delete { opacity: 1; }
.card .card-delete:hover { color: #c44; background: #fdf0f0; }
.card-grid.single { grid-template-columns: 1fr; }

/* ===== Editor ===== */
.editor-header {
  display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
}
.editor-title-input {
  font-size: 1.2rem; font-weight: 600; border: none; background: transparent;
  padding: 4px 0; outline: none; flex: 1; min-width: 120px;
  border-bottom: 2px solid transparent; transition: border-color var(--transition);
  font-family: inherit;
}
.editor-title-input:focus { border-bottom-color: var(--accent); }
.editor-save-status { font-size: 0.78rem; color: var(--text-tertiary); white-space: nowrap; }

.editor-toolbar {
  display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding: 10px 14px; background: var(--surface);
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  margin-bottom: 14px;
}
.editor-toolbar .tool-group { display: flex; align-items: center; gap: 8px; }
.editor-toolbar .tool-label { font-size: 0.78rem; color: var(--text-secondary); }
.editor-toolbar .tool-value { font-size: 0.85rem; font-weight: 500; color: var(--text); min-width: 24px; text-align: center; }

/* Font size slider */
input[type="range"] {
  -webkit-appearance: none; appearance: none; width: 80px; height: 3px;
  background: var(--border); border-radius: 2px; outline: none; cursor: pointer;
}
input[type="range"]::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none; width: 14px; height: 14px;
  background: var(--accent); border-radius: 50%; cursor: pointer;
  transition: transform var(--transition);
}
input[type="range"]::-webkit-slider-thumb:hover { transform: scale(1.15); }
input[type="range"]::-moz-range-thumb {
  width: 14px; height: 14px; background: var(--accent); border-radius: 50%; border: none; cursor: pointer;
}

.editor-timer {
  display: flex; align-items: center; gap: 6px;
  font-size: 0.85rem; color: var(--text-secondary); font-variant-numeric: tabular-nums;
}
.editor-timer .timer-icon { font-size: 0.8rem; }
.editor-wordcount { font-size: 0.85rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

.editor-textarea {
  width: 100%; min-height: calc(100vh - 320px); padding: 20px;
  font-size: 16px; line-height: 1.9;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text); resize: vertical;
  outline: none; font-family: inherit;
  transition: border-color var(--transition);
}
.editor-textarea:focus { border-color: var(--accent); }
.editor-textarea::placeholder { color: var(--text-tertiary); }

.editor-footer {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 12px; padding-bottom: 40px;
}
.editor-footer .ef-meta { font-size: 0.78rem; color: var(--text-tertiary); }

/* ===== Idea Editor ===== */
.idea-editor-title {
  width: 100%; font-size: 1.2rem; font-weight: 600; border: none; background: transparent;
  padding: 8px 0; outline: none; border-bottom: 2px solid transparent;
  margin-bottom: 16px; font-family: inherit;
  transition: border-color var(--transition);
}
.idea-editor-title:focus { border-bottom-color: var(--accent); }
.idea-editor-content {
  width: 100%; min-height: 200px; padding: 16px;
  font-size: 0.95rem; line-height: 1.8;
  border: 1px solid var(--border); border-radius: var(--radius);
  background: var(--surface); color: var(--text); resize: vertical;
  outline: none; font-family: inherit;
  transition: border-color var(--transition);
}
.idea-editor-content:focus { border-color: var(--accent); }

/* ===== Empty State ===== */
.empty-state {
  text-align: center; padding: 48px 20px; color: var(--text-tertiary);
}
.empty-state .empty-icon { font-size: 2rem; margin-bottom: 12px; opacity: 0.5; }
.empty-state .empty-text { font-size: 0.9rem; }

/* ===== Modal / Confirm Dialog ===== */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.25);
  z-index: 100; align-items: center; justify-content: center;
}
.modal-overlay.show { display: flex; }
.modal {
  background: var(--surface); border-radius: var(--radius); padding: 28px 24px 20px;
  max-width: 360px; width: 90%; box-shadow: 0 12px 40px rgba(0,0,0,0.12);
  animation: fadeIn 0.2s ease;
}
.modal h3 { margin-bottom: 8px; font-weight: 600; color: var(--text); }
.modal p { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 20px; line-height: 1.5; }
.modal .btn-group { justify-content: flex-end; }

/* ===== 文梗 ===== */
.prompts-sub { padding: 16px 0 40px; }
.tabs { display: flex; gap: 4px; margin: 4px 0 16px; border-bottom: 1px solid var(--border); }
.tab-btn {
  flex: 1; padding: 10px 0; background: none; border: none; border-bottom: 2px solid transparent;
  color: var(--text-secondary); font-size: .92rem; cursor: pointer; font-family: inherit;
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  transition: all var(--transition);
}
.tab-btn svg { width: 16px; height: 16px; }
.tab-btn.active { color: var(--text); border-bottom-color: var(--accent); font-weight: 600; }
.tab-panel { display: none; }
.tab-panel.active { display: block; animation: fadeIn .25s ease; }

/* 组合抽签 */
.draw-cats { display: flex; flex-wrap: nowrap; justify-content: center; gap: 6px; margin: 12px 0 8px; }
.cat-chip {
  display: inline-flex; align-items: center; justify-content: center; gap: 4px;
  padding: 4px 10px; border-radius: 20px; border: 1px solid var(--border);
  background: var(--surface); color: var(--text-secondary); font-size: .78rem; cursor: pointer;
  transition: all var(--transition); font-family: inherit;
}
.cat-chip.active { border-color: var(--accent); color: var(--accent); background: var(--accent-light); font-weight: 600; }
.combo-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 18px 16px; margin: 14px 0; transition: all var(--transition);
}
.combo-card .cc-row {
  display: flex; align-items: baseline; gap: 12px; padding: 6px 0;
  border-bottom: 1px dashed var(--border-light);
}
.combo-card .cc-row:last-child { border-bottom: none; }
.combo-card .cc-cat { font-size: .72rem; color: var(--text-tertiary); width: 56px; flex-shrink: 0; letter-spacing: .06em; }
.combo-card .cc-word { font-size: 1.05rem; font-weight: 600; }
.combo-card.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-light); }

/* 题库 */
.pool-section-title { display: flex; justify-content: space-between; align-items: center; margin: 18px 0 10px; }
.pool-section-title h3 { font-size: .92rem; color: var(--text-secondary); font-weight: 600; }
.pool-item {
  display: flex; align-items: center; gap: 10px; padding: 11px 14px;
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--surface);
  margin-bottom: 8px; transition: all var(--transition);
}
.pool-item .pi-kw { font-weight: 600; flex: 1; }
.pool-item .pi-actions { display: flex; gap: 6px; flex-shrink: 0; }
.pool-item .pi-hidden-kw { opacity: .4; text-decoration: line-through; }
.tag {
  display: inline-block; font-size: .66rem; padding: 2px 8px; border-radius: 10px;
  background: var(--surface-alt); color: var(--text-secondary); border: 1px solid var(--border);
  flex-shrink: 0;
}
.tag.custom { color: var(--accent); border-color: var(--accent-light); background: var(--accent-light); }

/* ===== 标签 ===== */
/* 编辑器里的标签编辑行 */
.tag-edit-row { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; margin: 0 0 14px; }
.tag-chip {
  display: inline-flex; align-items: center; gap: 2px;
  font-size: .72rem; padding: 3px 4px 3px 10px; border-radius: 12px;
  background: var(--surface-alt); color: var(--text-secondary);
  border: 1px solid var(--border); max-width: 160px;
}
.tag-chip .tag-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tag-chip .tag-x {
  border: none; background: none; color: var(--text-tertiary); cursor: pointer;
  font-size: .9rem; line-height: 1; padding: 0 3px; font-family: inherit;
  border-radius: 50%; transition: color var(--transition);
}
.tag-chip .tag-x:hover { color: #c44; }
.tag-add-btn {
  border: 1px dashed var(--border); background: none; color: var(--text-tertiary);
  font-size: .72rem; padding: 3px 10px; border-radius: 12px; cursor: pointer;
  font-family: inherit; transition: all var(--transition);
}
.tag-add-btn:hover { border-color: var(--accent); color: var(--accent); }
.tag-input {
  border: 1px solid var(--accent); background: var(--surface); color: var(--text);
  font-size: .72rem; padding: 3px 10px; border-radius: 12px; outline: none;
  font-family: inherit; width: 110px;
}
/* 作品页筛选栏 */
.tag-filter { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 16px; }
.tag-filter:empty { display: none; }
.tag-filter .cat-chip { font-size: .72rem; padding: 3px 10px; }
.tag-filter-label { font-size: .72rem; color: var(--text-tertiary); align-self: center; margin-right: 2px; }
/* 卡片上的标签 */
.card .card-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 8px; }
.pool-search { width: 100%; padding: 8px 12px; border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: .88rem; font-family: inherit; background: var(--surface); color: var(--text); outline: none; margin-bottom: 14px; }
.pool-search:focus { border-color: var(--accent); }

/* 收藏 */
.collected-stats { display: flex; gap: 14px; padding: 12px 14px; margin-bottom: 14px;
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-size: .82rem; color: var(--text-secondary); }
.collected-stats b { color: var(--text); }
.collected-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 14px; margin-bottom: 10px; transition: all var(--transition);
}
.collected-card .cc-top { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
.collected-card .cc-title { font-weight: 600; flex: 1; }
.collected-card .cc-title.written { text-decoration: line-through; color: var(--text-secondary); }
.collected-card .cc-meta { font-size: .75rem; color: var(--text-tertiary); display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.collected-card .cc-note { font-size: .82rem; color: var(--text-secondary); margin-top: 6px; font-style: italic; }
.collected-card .cc-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }

.app-footer { margin-top: 48px; padding: 16px; text-align: center; font-size: .75rem; color: var(--text-tertiary); }

/* ===== Responsive ===== */
@media (max-width: 520px) {
  #app { padding: 0 16px calc(72px + env(safe-area-inset-bottom)); }
  .card-grid { grid-template-columns: 1fr; }
  .stats-bar { padding: 8px 4px 5px; }
  .editor-toolbar { gap: 8px; padding: 8px 10px; }
  /* 收窄滑块，让「字号 / 字数 / 计时 / AI」四项在 375px 下压回一行，避免换行顶矮输入框 */
  input[type="range"] { width: 60px; }
  .editor-textarea { padding: 14px; min-height: calc(100vh - 340px); }
  .quick-actions { flex-direction: column; }
  .quick-actions .btn { padding: 10px; }
  header { gap: 8px; }
  header .actions { gap: 4px; }
  header .title { gap: 6px; }
  header .theme-dots { gap: 3px; }
  header .theme-dot { width: 12px; height: 12px; }
}

/* PWA standalone mode */
@media all and (display-mode: standalone) {
  body { padding-top: env(safe-area-inset-top); padding-bottom: env(safe-area-inset-bottom); overscroll-behavior: none; }
  #app { padding-left: calc(20px + env(safe-area-inset-left)); padding-right: calc(20px + env(safe-area-inset-right)); }
  header { padding-top: max(20px, env(safe-area-inset-top)); }
  .editor-textarea { -webkit-overflow-scrolling: touch; }
}
@media all and (display-mode: standalone) and (max-width: 520px) {
  #app { padding-left: calc(16px + env(safe-area-inset-left)); padding-right: calc(16px + env(safe-area-inset-right)); }
}
</style>
</head>
<body>

<div id="app">

  <!-- ===== 我的 ===== -->
  <section id="page-me" class="page">
    <header>
      <div class="title"><span class="t-name">我的</span></div>
    </header>

    <div class="section-header"><h2>改文</h2></div>
    <div class="me-card">
      <div class="me-row">
        <label class="me-label" for="ai-key">API Key</label>
        <div class="input-with-btn">
          <input type="password" class="me-input" id="ai-key" placeholder="sk-..." autocomplete="off" spellcheck="false">
          <button class="btn btn-sm" id="ai-key-toggle" onclick="toggleKeyVisible()">显示</button>
        </div>
      </div>
      <div class="me-row">
        <label class="me-label" for="ai-base">接口地址</label>
        <input type="text" class="me-input" id="ai-base" spellcheck="false"
               placeholder="https://api.deepseek.com/v1/chat/completions">
      </div>
      <div class="me-row">
        <label class="me-label" for="ai-model">模型</label>
        <input type="text" class="me-input" id="ai-model" spellcheck="false" placeholder="deepseek-v4-flash">
      </div>
      <div class="me-row">
        <label class="me-label" for="editor-name">编辑的名字</label>
        <input type="text" class="me-input" id="editor-name" spellcheck="false" placeholder="阿笺"
               onchange="saveEditorName(this.value)">
      </div>
      <div class="me-hint">「编辑的名字」是改文页里跟你聊稿子那位，改完她以后就叫这个。Key 只存在这台设备的浏览器里，不会上传到任何地方。换别的模型只要改上面接口地址和模型名——国内能浏览器直连的主要是 DeepSeek 和智谱。</div>
      <div class="btn-group" style="margin-top:14px;">
        <button class="btn btn-primary" onclick="saveAIConfig()">保存</button>
        <button class="btn" id="btn-test-ai" onclick="testAIConnection()">测试连接</button>
      </div>
    </div>

    <div class="section-header"><h2>主题</h2></div>
    <div class="me-card">
      <div class="theme-dots" id="theme-dots"></div>
    </div>

    <div class="section-header"><h2>数据</h2></div>
    <div class="me-card">
      <div class="me-hint">作品和灵感都存在这台设备的浏览器里，清缓存会丢。偶尔导出一次备份比较稳妥。</div>
      <div class="btn-group" style="margin-top:14px;">
        <button class="btn" onclick="exportAllData()">导出备份</button>
        <button class="btn" onclick="importAllData()">导入备份</button>
        <button class="btn btn-sm install-btn" id="install-btn" style="display:none;" onclick="installApp()">↓ 安装到桌面</button>
      </div>
    </div>

    <footer class="app-footer" id="app-version"></footer>
  </section>

  <!-- ===== WORKS ===== -->
  <section id="page-works" class="page">
    <header>
      <div class="title"><span class="t-name">作品</span></div>
      <div class="actions">
        <button class="btn btn-sm btn-primary" onclick="createNewWork()">+ 新建</button>
      </div>
    </header>
    <div class="stats-bar" id="home-stats"></div>
    <div id="works-filter" style="display:flex;gap:6px;margin-bottom:16px;">
      <button class="btn btn-sm filter-btn" data-filter="all" onclick="filterWorks('all')">全部</button>
      <button class="btn btn-sm filter-btn active-filter" data-filter="novel" onclick="filterWorks('novel')">小说</button>
    </div>
    <div class="tag-filter" id="works-tags"></div>
    <div class="card-grid" id="works-grid"></div>
  </section>

  <!-- ===== EDITOR ===== -->
  <section id="page-editor" class="page">
    <header>
      <button class="back" onclick="navigate('works')">← 返回</button>
      <div class="actions">
        <button class="btn btn-sm btn-ghost" onclick="gotoPolish()">拿去改文</button>
        <button class="btn btn-sm btn-ghost" onclick="exportWork()" id="btn-export">↓ 导出</button>
        <button class="btn btn-sm btn-ghost" onclick="deleteCurrentWork()" id="btn-delete-work" style="color:var(--text-tertiary)">× 删除</button>
      </div>
    </header>

    <div class="editor-header">
      <input type="text" class="editor-title-input" id="editor-title" placeholder="作品标题" spellcheck="false">
      <span class="editor-save-status" id="editor-save-status"></span>
    </div>
    <div class="tag-edit-row" id="editor-tags"></div>

    <div class="editor-toolbar">
      <div class="tool-group">
        <span class="tool-label">字号</span>
        <input type="range" id="font-size-slider" min="12" max="28" value="16">
        <span class="tool-value" id="font-size-label">16</span>
      </div>
      <div class="tool-group" style="margin-left:auto;">
        <span class="editor-wordcount" id="editor-wordcount">0 字</span>
      </div>
      <div class="tool-group">
        <span class="editor-timer"><span class="timer-icon">◷</span> <span id="editor-timer">00:00:00</span></span>
      </div>
    </div>

    <textarea class="editor-textarea" id="editor-content" placeholder="开始写吧……"></textarea>

    <div class="editor-footer">
      <span class="ef-meta" id="editor-last-saved"></span>
    </div>
  </section>

  <!-- ===== 改文 =====
       以前这个功能是编辑器里的一个抽屉：点一下、出一份诊断、关掉，就没了。
       现在挪出来单独一页 —— 它是个对话，不是一份报告：她提意见，你可以同意也可以反驳，
       一篇稿子的来回都留在记录里，随时回看、随时删。
       【铁律】她只指方向，绝不替你把句子写出来；原文永远是你自己动手改。 -->
  <section id="page-polish" class="page">
    <header>
      <div class="title"><span class="t-name">改文</span></div>
      <div class="actions">
        <button class="btn btn-sm btn-ghost" onclick="clearPolishThread()" style="color:var(--text-tertiary)">清空记录</button>
      </div>
    </header>

    <div class="polish-pick">
      <span class="polish-pick-label">改哪一篇</span>
      <select class="me-input polish-select" id="polish-work" onchange="onPolishWorkChange(this.value)"></select>
    </div>

    <div class="polish-text-head" onclick="togglePolishText()">
      <span>原文</span>
      <span class="polish-text-meta">可以直接在这儿改 · 划一段给她看 <span id="polish-text-chevron">▾</span></span>
    </div>
    <div id="polish-text-wrap" style="display:none;">
      <textarea class="polish-textarea" id="polish-text" placeholder="这篇还是空的"
                oninput="onPolishTextInput()" onselect="updatePolishSelChip()"
                onmouseup="updatePolishSelChip()" onkeyup="updatePolishSelChip()"></textarea>
      <div class="polish-text-foot"><span id="polish-wordcount">0 字</span><span id="polish-save-status"></span></div>
    </div>

    <div class="polish-thread" id="polish-thread"></div>

    <div class="polish-bar">
      <button class="polish-sel-chip" id="polish-sel-chip" onclick="usePolishSelection()">没选中</button>
      <input class="polish-input" id="polish-input" placeholder="跟她说点什么…" spellcheck="false"
             onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendPolish();}">
      <button class="btn btn-primary btn-sm" id="polish-send" onclick="sendPolish()">说</button>
    </div>
  </section>

  <!-- ===== IDEAS ===== -->
  <section id="page-ideas" class="page">
    <header>
      <div class="title">灵感</div>
      <div class="actions">
        <button class="btn btn-sm btn-primary" onclick="createNewIdea()">+ 新建</button>
      </div>
    </header>
    <div class="card-grid" id="ideas-grid"></div>
  </section>

  <!-- ===== IDEA EDITOR ===== -->
  <section id="page-idea-editor" class="page">
    <header>
      <button class="back" onclick="navigate('ideas')">← 返回</button>
      <div class="title">编辑灵感</div>
      <div class="actions">
        <button class="btn btn-sm btn-ghost" onclick="deleteCurrentIdea()" style="color:var(--text-tertiary)">× 删除</button>
      </div>
    </header>
    <input type="text" class="idea-editor-title" id="idea-editor-title" placeholder="灵感标题" spellcheck="false">
    <div class="tag-edit-row" id="idea-tags"></div>
    <textarea class="idea-editor-content" id="idea-editor-content" placeholder="记录你的灵感……"></textarea>
    <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:12px;padding-bottom:40px;">
      <button class="btn btn-primary" onclick="saveIdeaEdit()">保存</button>
    </div>
  </section>

  <!-- ===== 文梗 ===== -->
  <section id="page-prompts" class="page">
    <header>
      <div class="title">文梗</div>
      <div class="actions">
        <span class="editor-save-status" id="prompts-count"></span>
      </div>
    </header>

    <nav class="tabs" id="prompts-tabs">
      <button class="tab-btn active" data-tab="draw" onclick="setPromptsTab('draw')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M7 9h10M7 13h6"/></svg>抽签
      </button>
      <button class="tab-btn" data-tab="pool" onclick="setPromptsTab('pool')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h10"/></svg>题库
      </button>
      <button class="tab-btn" data-tab="collected" onclick="setPromptsTab('collected')">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M12 3l2.7 5.5 6 .9-4.3 4.2 1 6-5.4-2.9-5.4 2.9 1-6L3.3 9.4l6-.9z"/></svg>收藏
      </button>
    </nav>

    <div class="prompts-sub">
      <!-- 抽签 -->
      <div class="tab-panel active" data-panel="draw">
        <div class="draw-cats" id="draw-cats"></div>
        <div class="btn-group" style="justify-content:center;">
          <button class="btn btn-primary" id="btn-draw" onclick="doDraw()">抽一题</button>
          <button class="btn" id="btn-redraw" style="display:none;" onclick="redraw()">换一批</button>
        </div>
        <div id="combo-area"></div>
        <div class="btn-group" id="draw-actions" style="display:none;justify-content:center;margin-top:14px;">
          <button class="btn btn-primary" onclick="writeFromCombo()">开写</button>
          <button class="btn" onclick="collectCombo()">收藏这道题</button>
        </div>
      </div>

      <!-- 题库 -->
      <div class="tab-panel" data-panel="pool">
        <div class="btn-group" style="margin-bottom:14px;">
          <button class="btn btn-primary btn-sm" onclick="openPromptEditor()">+ 新增文梗</button>
          <button class="btn btn-sm" onclick="toggleShowHidden()" id="btn-show-hidden">显示已隐藏</button>
        </div>
        <input class="pool-search" id="pool-search" placeholder="搜关键词" oninput="renderPool()">
        <div id="pool-list"></div>
      </div>

      <!-- 收藏 -->
      <div class="tab-panel" data-panel="collected">
        <div class="collected-stats" id="collected-stats"></div>
        <div style="display:flex;gap:6px;margin-bottom:14px;">
          <button class="btn btn-sm filter-btn active-filter" data-f="all" onclick="setCollectedFilter('all')">全部</button>
          <button class="btn btn-sm filter-btn" data-f="unwritten" onclick="setCollectedFilter('unwritten')">未写</button>
          <button class="btn btn-sm filter-btn" data-f="written" onclick="setCollectedFilter('written')">已写</button>
        </div>
        <div id="collected-list"></div>
      </div>
    </div>
  </section>

  <!-- ===== 文梗编辑弹窗 ===== -->
  <div class="modal-overlay" id="prompt-modal-overlay">
    <div class="modal">
      <h3 id="prompt-modal-title">新增文梗</h3>
      <div style="margin-bottom:14px;">
        <div style="font-size:.78rem;color:var(--text-secondary);margin-bottom:6px;">关键词</div>
        <input class="pool-search" id="prompt-keyword" placeholder="如：破镜重圆" style="margin-bottom:0;">
      </div>
      <div style="margin-bottom:20px;">
        <div style="font-size:.78rem;color:var(--text-secondary);margin-bottom:6px;">维度</div>
        <select class="pool-search" id="prompt-category" style="margin-bottom:0;"></select>
      </div>
      <div class="btn-group">
        <button class="btn" onclick="closePromptModal()">取消</button>
        <button class="btn btn-primary" onclick="savePrompt()">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== 收藏备注弹窗 ===== -->
  <div class="modal-overlay" id="note-modal-overlay">
    <div class="modal">
      <h3>备注</h3>
      <textarea class="pool-search" id="note-input" rows="3" placeholder="记一句想怎么写……" style="margin-bottom:20px;resize:vertical;"></textarea>
      <div class="btn-group">
        <button class="btn" onclick="closeNoteModal()">取消</button>
        <button class="btn btn-primary" onclick="saveCollectedNote()">保存</button>
      </div>
    </div>
  </div>

  <!-- ===== Modal ===== -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="modal">
      <h3 id="modal-title">确认</h3>
      <p id="modal-text">确定要删除吗？</p>
      <div class="btn-group">
        <button class="btn" onclick="closeModal()">取消</button>
        <button class="btn btn-danger" id="modal-confirm">删除</button>
      </div>
    </div>
  </div>

  <!-- ===== 底部导航 ===== -->
  <nav class="bnav" id="bnav">
    <button class="bnav-item" data-nav="works" onclick="navigate('works')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5.5A1.5 1.5 0 015.5 4H10l2 2h6.5A1.5 1.5 0 0120 7.5v10A1.5 1.5 0 0118.5 19h-13A1.5 1.5 0 014 17.5z"/></svg>

    </button>

      我的
    </button>

</div>

<script>
// ============================================================
// DATA LAYER
// ============================================================
const DB = {
  getWorks() {
    try { return JSON.parse(localStorage.getItem('writing_works') || '[]'); } catch { return []; }
  },
  saveWorks(works) {
    localStorage.setItem('writing_works', JSON.stringify(works));
  },
  getSettings() {
    try { return JSON.parse(localStorage.getItem('writing_settings') || '{"fontSize":16}'); } catch { return {fontSize:16}; }
  },
  saveSettings(s) {
    localStorage.setItem('writing_settings', JSON.stringify(s));
  },
  getPrompts() { try { return JSON.parse(localStorage.getItem('writing_prompts_custom') || '[]'); } catch { return []; } },
  savePrompts(a) { localStorage.setItem('writing_prompts_custom', JSON.stringify(a)); },
  getHidden() { try { return JSON.parse(localStorage.getItem('writing_prompts_hidden') || '[]'); } catch { return []; } },
  saveHidden(a) { localStorage.setItem('writing_prompts_hidden', JSON.stringify(a)); },
  getCollected() { try { return JSON.parse(localStorage.getItem('writing_collected') || '[]'); } catch { return []; } },
  saveCollected(a) { localStorage.setItem('writing_collected', JSON.stringify(a)); },
  getMeta() { try { return JSON.parse(localStorage.getItem('writing_meta') || 'null'); } catch { return null; } },
  saveMeta(m) { localStorage.setItem('writing_meta', JSON.stringify(m)); },
  genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }
};

// 统一的 work 对象工厂 —— 新建作品 / 记灵感 / 从文梗开写都走这里
function makeWork(type, opts = {}) {
  const now = new Date().toISOString();
  return {
    id: DB.genId(),
    title: opts.title || '',
    type: type || 'novel',
    content: opts.content || '',
    tags: opts.tags ? opts.tags.slice() : [],
    analyses: [],
    createdAt: now,
    updatedAt: now,
    totalWritingTimeMs: 0,
  };
}

// ============================================================
// 文梗题库
// ============================================================
const CATEGORIES = [
  { key: '世界观', words: ['都市', '校园', '古风', '民国', '星际', '末世', '修真', '西幻', '宫廷', '江湖', '娱乐圈', '电竞', '童话', '海洋', '乡村', '古代', '神鬼', '苗疆'] },
  { key: '人物关系', words: ['青梅竹马', '欢喜冤家', '宿敌', '死对头', '姐弟恋', '兄妹', '网友奔现', '笔友', '邻居', '合租', '替身', '白月光', '双向暗恋', '单向暗恋', '上司下属', '师徒', '伪骨科', '养成系', '年上', '年下', '仇人子女'] },
  { key: '设定', words: ['失忆', '重生', '穿越', '平行时空', '系统', '读心术', '非人恋', '灵魂互换', '哑巴恋人', '盲眼', '病弱', '卧底', '双面人生', '古穿今', '黑化', '穿书', '快穿', '金手指', '契约婚姻', '先婚后爱'] },
  { key: '情节', words: ['破镜重圆', '久别重逢', '追妻火葬场', '救赎', '双向奔赴', '一见钟情', '十年之约', '分手旅行', '假戏真做', '伪装情侣', '婚约', '破冰', 'he改be', 'be改he', '破镜难圆', '复合'] },
  { key: '形式', words: ['只写对话', '第二人称', '旁观者视角', '开放式结局', 'BE美学', '字数限定', '书信体', '倒叙', '日记体', '反转结局', '第一人称'] },
];
const BUILTIN_TROPES = CATEGORIES.flatMap(c => c.words.map(w => ({ keyword: w, category: c.key })));
const APP_VERSION = 'v2.2.0 (2026.09.19)';

// ============================================================
// THEME SYSTEM
// ============================================================
const THEMES = {
  default:  { name: '原木', dot: '#c4a882' },
  sky:      { name: '晴空', dot: '#bae6fb' },
  mint:     { name: '薄荷', dot: '#86cfa3' },
  cream:    { name: '奶油', dot: '#fde68a' },
  white:    { name: '纯白', dot: '#d0d0d0' },
  dusk:     { name: '暮色', dot: '#8a8070' },
  navy:     { name: '夜蓝', dot: '#5a7a9a' },
  charcoal: { name: '雾灰', dot: '#787878' },
};

function setTheme(key) {
  if (!THEMES[key]) key = 'default';
  document.documentElement.setAttribute('data-theme', key);
  localStorage.setItem('writing_theme', key);
  // Update browser theme color for PWA
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta) {
    const bg = getComputedStyle(document.documentElement).getPropertyValue('--bg').trim();
    meta.setAttribute('content', bg || '#f8f6f3');
  }
  // Update dots active state
  document.querySelectorAll('.theme-dot').forEach(el => {
    el.classList.toggle('active', el.dataset.theme === key);
  });
}

function getTheme() {
  return localStorage.getItem('writing_theme') || 'default';
}

function renderThemeDots() {
  const container = document.getElementById('theme-dots');
  if (!container) return;
  const current = getTheme();
  container.innerHTML = Object.entries(THEMES).map(([key, t]) =>
    `<div class="theme-dot ${key === current ? 'active' : ''}" data-theme="${key}"
         style="background:${t.dot}" title="${t.name}"
         onclick="setTheme('${key}')"></div>`
  ).join('');
}

// ============================================================
// STATE
// ============================================================
let state = {
  currentWorkId: null,
  currentIdeaId: null,
  worksFilter: 'novel',
  tagFilter: [],          // 作品页选中的标签（多选 = 同时含有）
  timerInterval: null,
  timerStartTime: null,
  timerAccumulated: 0,
  saveTimeout: null,
  lastContent: '',
  // 文梗
  promptsTab: 'draw',     // draw | pool | collected
  drawCats: null,         // {世界观:true, ...}
  combo: null,            // 最近组合题 {维度:词}
  comboSelected: false,
  showHidden: false,
  collectedFilter: 'all',
  poolSearch: '',
  editingPromptId: null,
};

// ============================================================
// ROUTER
// ============================================================
function navigate(page, params) {
  window.location.hash = page + (params ? '?' + params : '');
}

function getPageFromHash() {
  const hash = window.location.hash.slice(1) || 'works';
  const parts = hash.split('?');
  return { page: parts[0], params: parts[1] || '' };
}

function parseParams(qs) {
  const params = {};
  if (!qs) return params;
  qs.split('&').forEach(p => {
    const [k, v] = p.split('=');
    params[decodeURIComponent(k)] = decodeURIComponent(v || '');
  });
  return params;
}

function router() {
  const { page, params } = getPageFromHash();
  const p = parseParams(params);

  // Hide all pages
  document.querySelectorAll('.page').forEach(el => el.classList.remove('active'));

  // Stop any running timer
  stopTimer();

  switch (page) {
    case 'works':
      document.getElementById('page-works').classList.add('active');
      renderWorks();
      break;
    case 'editor':
      document.getElementById('page-editor').classList.add('active');
      state.currentWorkId = p.id || null;
      initEditor(state.currentWorkId);
      break;
    case 'polish':
      document.getElementById('page-polish').classList.add('active');
      renderPolishPage(p.id || '');
      break;
    case 'ideas':
      document.getElementById('page-ideas').classList.add('active');
      renderIdeas();
      break;
    case 'idea-editor':
      document.getElementById('page-idea-editor').classList.add('active');
      state.currentIdeaId = p.id || null;
      initIdeaEditor(state.currentIdeaId);
      break;
    case 'prompts':
      document.getElementById('page-prompts').classList.add('active');
      if (p.tab && ['draw', 'pool', 'collected'].includes(p.tab)) state.promptsTab = p.tab;
      renderPromptsPage();
      break;
    case 'me':
      document.getElementById('page-me').classList.add('active');
      renderMe();
      break;
    default:
      document.getElementById('page-works').classList.add('active');
      renderWorks();
  }

  updateBottomNav(page);
}

// 底部导航高亮；写作/灵感编辑器是沉浸页，不显示底栏
function updateBottomNav(page) {
  const nav = document.getElementById('bnav');
  if (!nav) return;
  nav.classList.toggle('hidden', page === 'editor' || page === 'idea-editor');
  const map = {
    works: 'works', editor: 'works',
    polish: 'polish',
    ideas: 'ideas', 'idea-editor': 'ideas',
    prompts: 'prompts', me: 'me',
  };
  const active = map[page] || 'works';
  nav.querySelectorAll('.bnav-item').forEach(btn => {
    btn.classList.toggle('active', btn.dataset.nav === active);
  });
}

window.addEventListener('hashchange', router);

// ============================================================
// HELPERS
// ============================================================
function countChars(text) {
  if (!text) return 0;
  // Count all non-whitespace characters (standard for Chinese word count)
  return text.replace(/\s/g, '').length;
}

function formatTime(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  return String(h).padStart(2, '0') + ':' + String(m).padStart(2, '0') + ':' + String(s).padStart(2, '0');
}

function formatTimeShort(ms) {
  const totalSec = Math.floor(ms / 1000);
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  if (h > 0) return h + 'h ' + m + 'm';
  return m + 'm ' + (totalSec % 60) + 's';
}

function formatDate(iso) {
  if (!iso) return '';
  const d = new Date(iso);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return '刚刚';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' 分钟前';
  if (diff < 86400000) return Math.floor(diff / 3600000) + ' 小时前';
  if (diff < 172800000) return '昨天';
  return (d.getMonth() + 1) + '/' + d.getDate();
}

function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

// ============================================================
// 文梗 · 工具
// ============================================================
function shuffle(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickRandomN(pool, n) {
  if (!pool || pool.length === 0) return [];
  return shuffle(pool).slice(0, Math.min(n, pool.length));
}

// 运行时合并：内置(过滤隐藏) + 自定义；每个词都有稳定 id
function getAllPrompts() {
  const hidden = DB.getHidden();
  const builtins = BUILTIN_TROPES
    .filter(p => !hidden.includes(p.keyword))
    .map(p => ({ id: 'b_' + p.keyword, ...p, source: 'builtin' }));
  const customs = DB.getPrompts()
    .filter(p => !hidden.includes(p.keyword))
    .map(p => ({ ...p, source: 'custom' }));
  return [...builtins, ...customs];
}

function getPromptsByCategory(cat) {
  return getAllPrompts().filter(p => p.category === cat);
}

function normalizeCollected(c) {
  return Object.assign({ id: '', title: '', combo: null, keyword: '', source: 'draw', champion: false, note: '', written: false, writtenAt: null, createdAt: new Date().toISOString() }, c);
}

function migrateData() {
  let meta = DB.getMeta();
  if (!meta || typeof meta.schemaVersion !== 'number') meta = { schemaVersion: 0 };
  if (meta.schemaVersion < 1) {
    if (!Array.isArray(DB.getPrompts())) DB.savePrompts([]);
    if (!Array.isArray(DB.getHidden())) DB.saveHidden([]);
    if (!Array.isArray(DB.getCollected())) DB.saveCollected(DB.getCollected().map(normalizeCollected));
    meta.schemaVersion = 1;
  }
  if (meta.schemaVersion < 2) {
    // v2: 作品加标签，老数据补空数组
    const works = DB.getWorks().map(w => ({
      ...w,
      tags: Array.isArray(w.tags) ? w.tags : [],
    }));
    DB.saveWorks(works);
    meta.schemaVersion = 2;
  }
  if (meta.schemaVersion < 3) {
    // v3: 作品加 AI 分析记录，老数据补空数组
    const works = DB.getWorks().map(w => ({
      ...w,
      analyses: Array.isArray(w.analyses) ? w.analyses : [],
    }));
    DB.saveWorks(works);
    meta.schemaVersion = 3;
  }
  DB.saveMeta(meta);
}

// ============================================================
// MODAL
// ============================================================
let modalCallback = null;

function showModal(title, text, cb, btnLabel) {
  document.getElementById('modal-title').textContent = title;
  document.getElementById('modal-text').textContent = text;
  document.getElementById('modal-confirm').textContent = btnLabel || '删除';
  document.getElementById('modal-overlay').classList.add('show');
  modalCallback = cb;
}

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('show');
  modalCallback = null;
}

document.getElementById('modal-confirm').addEventListener('click', () => {
  document.getElementById('modal-overlay').classList.remove('show');
  if (modalCallback) modalCallback();
  modalCallback = null;
});

document.getElementById('modal-overlay').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) closeModal();
});

// ============================================================
// 统计条（原首页，已并进作品页顶部）
// ============================================================
function renderStats() {
  const works = DB.getWorks();
  const novels = works.filter(w => w.type === 'novel');
  const ideas = works.filter(w => w.type === 'idea');

  // 灵感是随手记的碎片，不算进「字数」——那里只记真正写出来的正文
  const totalWords = novels.reduce((sum, w) => sum + countChars(w.content || ''), 0);
  const totalTime = novels.reduce((sum, w) => sum + (w.totalWritingTimeMs || 0), 0);

  const el = document.getElementById('home-stats');
  if (!el) return;
  el.innerHTML = `
    <div class="stat-item">
      <div class="si-value">${totalWords.toLocaleString()}</div>
      <div class="si-label">字数</div>
    </div>
    <div class="stat-item">
      <div class="si-value">${formatTimeShort(totalTime)}</div>
      <div class="si-label">时长</div>
    </div>
    <div class="stat-item">
      <div class="si-value">${novels.length}</div>
      <div class="si-label">作品</div>
    </div>
    <div class="stat-item">
      <div class="si-value">${ideas.length}</div>
      <div class="si-label">灵感</div>
    </div>
  `;
}

// ============================================================
// 标签
// ============================================================
function getAllTags() {
  const set = new Set();
  DB.getWorks().forEach(w => (w.tags || []).forEach(t => set.add(t)));
  return [...set].sort((a, b) => a.localeCompare(b, 'zh'));
}

function updateWorkTags(workId, mutate) {
  const works = DB.getWorks();
  const w = works.find(x => x.id === workId);
  if (!w) return;
  if (!Array.isArray(w.tags)) w.tags = [];
  mutate(w);
  w.updatedAt = new Date().toISOString();
  DB.saveWorks(works);
}

// 渲染编辑器里的标签行
function renderTagEditor(containerId, workId) {
  const el = document.getElementById(containerId);
  if (!el) return;
  const w = DB.getWorks().find(x => x.id === workId);
  if (!w) { el.innerHTML = ''; return; }
  const tags = w.tags || [];
  el.innerHTML =
    tags.map((t, i) =>
      `<span class="tag-chip"><span class="tag-name">${escapeHtml(t)}</span>` +
      `<button class="tag-x" title="删除标签" onclick="removeTagAt('${containerId}','${workId}',${i})">×</button></span>`
    ).join('') +
    `<button class="tag-add-btn" onclick="openTagInput('${containerId}','${workId}')">+ 标签</button>`;
}

function openTagInput(containerId, workId) {
  const el = document.getElementById(containerId);
  const btn = el && el.querySelector('.tag-add-btn');
  if (!btn) return;
  const input = document.createElement('input');
  input.className = 'tag-input';
  input.placeholder = '标签名';
  input.maxLength = 16;
  input.onkeydown = (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      input.onblur = null;               // 别让 blur 再触发一次
      const v = input.value.trim();
      if (v) addTagTo(containerId, workId, v);
      else renderTagEditor(containerId, workId);
    } else if (e.key === 'Escape') {
      input.onblur = null;
      renderTagEditor(containerId, workId);
    }
  };
  input.onblur = () => {
    const v = input.value.trim();
    if (v) addTagTo(containerId, workId, v);
    else renderTagEditor(containerId, workId);
  };
  btn.replaceWith(input);
  input.focus();
}

function addTagTo(containerId, workId, tag) {
  const t = tag.trim().replace(/^#/, '');
  if (!t) { renderTagEditor(containerId, workId); return; }
  if (t.length > 16) { toast('标签太长了，16 字以内'); return; }
  updateWorkTags(workId, w => {
    if (!w.tags.includes(t)) w.tags.push(t);
  });
  renderTagEditor(containerId, workId);
  renderWorksTagFilter();
}

function removeTagAt(containerId, workId, idx) {
  updateWorkTags(workId, w => { w.tags.splice(idx, 1); });
  renderTagEditor(containerId, workId);
  renderWorksTagFilter();
}

// 作品页顶部的标签筛选栏（用索引而非标签名传参，避免引号把 onclick 拆坏）
function renderWorksTagFilter() {
  const el = document.getElementById('works-tags');
  if (!el) return;
  const all = getAllTags();
  if (!all.length) { el.innerHTML = ''; return; }
  el.innerHTML = all.map((t, i) =>
    `<button class="cat-chip ${state.tagFilter.includes(t) ? 'active' : ''}" onclick="toggleTagFilterAt(${i})">#${escapeHtml(t)}</button>`
  ).join('');
}

function toggleTagFilterAt(i) {
  const t = getAllTags()[i];
  if (!t) return;
  const idx = state.tagFilter.indexOf(t);
  if (idx >= 0) state.tagFilter.splice(idx, 1);
  else state.tagFilter.push(t);
  renderWorks();
}

// ============================================================
// WORKS PAGE
// ============================================================
function renderWorks() {
  const works = DB.getWorks();
  // 灵感有自己的底部 tab，作品页不再单独筛灵感；「全部」= 小说 + 灵感
  let filtered = works.filter(w => w.type === 'novel');
  if (state.worksFilter === 'all') filtered = works;

  // 标签筛选：多选 = 同时含有所选的全部标签
  if (state.tagFilter.length) {
    filtered = filtered.filter(w => {
      const tags = w.tags || [];
      return state.tagFilter.every(t => tags.includes(t));
    });
  }

  filtered.sort((a, b) => new Date(b.updatedAt) - new Date(a.updatedAt));

  const grid = document.getElementById('works-grid');

  // Update filter buttons
  document.querySelectorAll('.filter-btn').forEach(btn => {
    btn.classList.toggle('active-filter', btn.dataset.filter === state.worksFilter);
  });

  renderWorksTagFilter();
  renderStats();

  if (filtered.length === 0) {
    const emptyText = state.tagFilter.length ? '没有同时带这些标签的作品' : '这里还没有内容';
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1"><div class="empty-icon">-</div><div class="empty-text">${emptyText}</div></div>`;
    return;
  }

  grid.innerHTML = filtered.map(w => {
    const typeLabel = w.type === 'novel' ? '小说' : '灵感';
    const typeEmoji = w.type === 'novel' ? '📖' : '✨';
    const wordCount = countChars(w.content || '');
    return `<div class="card" onclick="navigate('${w.type === 'novel' ? 'editor' : 'idea-editor'}','id=${w.id}')">
      <button class="card-delete" onclick="event.stopPropagation();confirmDeleteWork('${w.id}')">×</button>
      <div class="card-title">${escapeHtml(w.title || '未命名')}</div>
      ${(w.tags || []).length ? `<div class="card-tags">${w.tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>` : ''}
      <div class="card-footer">
        <span class="card-type">${typeEmoji} ${typeLabel}</span>
        <span class="cf-divider">·</span>
        <span class="card-meta">${wordCount} 字</span>
        <span class="cf-divider">·</span>
        <span class="card-meta">${formatDate(w.updatedAt)}</span>
      </div>
    </div>`;
  }).join('');
}

function filterWorks(filter) {
  state.worksFilter = filter;
  renderWorks();
}

function confirmDeleteWork(id) {
  showModal('删除作品', '确定要删除这个作品吗？删除后无法恢复。', () => {
    let works = DB.getWorks();
    works = works.filter(w => w.id !== id);
    DB.saveWorks(works);
    renderWorks();
  });
}

function initEditor(id) {
  const titleInput = document.getElementById('editor-title');
  const contentArea = document.getElementById('editor-content');
  const saveStatus = document.getElementById('editor-save-status');
  const lastSaved = document.getElementById('editor-last-saved');
  const wordCount = document.getElementById('editor-wordcount');

  // Load settings
  const settings = DB.getSettings();
  contentArea.style.fontSize = settings.fontSize + 'px';
  document.getElementById('font-size-slider').value = settings.fontSize;
  document.getElementById('font-size-label').textContent = settings.fontSize;

  let work;
  if (id) {
    const works = DB.getWorks();
    work = works.find(w => w.id === id);
  }

  if (work) {
    titleInput.value = work.title || '';
    contentArea.value = work.content || '';
    state.timerAccumulated = work.totalWritingTimeMs || 0;
    saveStatus.textContent = '✓ 已保存';
    lastSaved.textContent = '最后保存：' + formatDate(work.updatedAt);
  } else {
    // Create new work
    work = makeWork('novel');
    const works = DB.getWorks();
    works.push(work);
    DB.saveWorks(works);
    state.currentWorkId = work.id;
    titleInput.value = '';
    contentArea.value = '';
    state.timerAccumulated = 0;
    saveStatus.textContent = '新作品';
    lastSaved.textContent = '';
  }

  state.lastContent = contentArea.value;
  updateWordCount();
  renderTagEditor('editor-tags', work.id);

  // Start timer
  startTimer();

  // Auto-save handler
  contentArea.oninput = () => {
    updateWordCount();
    scheduleAutoSave();
  };

  titleInput.oninput = () => {
    scheduleAutoSave();
  };

  // Font size slider
  document.getElementById('font-size-slider').oninput = function() {
    const size = parseInt(this.value);
    contentArea.style.fontSize = size + 'px';
    document.getElementById('font-size-label').textContent = size;
    const s = DB.getSettings();
    s.fontSize = size;
    DB.saveSettings(s);
  };

  // Keyboard shortcut: Ctrl+S to save
  contentArea.onkeydown = (e) => {
    if ((e.ctrlKey || e.metaKey) && e.key === 's') {
      e.preventDefault();
      saveCurrentWork();
    }
  };

  // Focus content area
  setTimeout(() => contentArea.focus(), 100);
}

function updateWordCount() {
  const content = document.getElementById('editor-content').value;
  document.getElementById('editor-wordcount').textContent = countChars(content).toLocaleString() + ' 字';
}

function scheduleAutoSave() {
  const status = document.getElementById('editor-save-status');
  status.textContent = '保存中...';
  if (state.saveTimeout) clearTimeout(state.saveTimeout);
  state.saveTimeout = setTimeout(saveCurrentWork, 1500);
}

function saveCurrentWork() {
  const id = state.currentWorkId;
  if (!id) return;

  const works = DB.getWorks();
  const work = works.find(w => w.id === id);
  if (!work) return;

  const title = document.getElementById('editor-title').value.trim();
  const content = document.getElementById('editor-content').value;

  work.title = title || '未命名';
  work.content = content;
  work.updatedAt = new Date().toISOString();
  work.totalWritingTimeMs = state.timerAccumulated + (state.timerStartTime ? Date.now() - state.timerStartTime : 0);

  DB.saveWorks(works);

  const status = document.getElementById('editor-save-status');
  status.textContent = '✓ 已保存';
  document.getElementById('editor-last-saved').textContent = '最后保存：刚刚';
  state.lastContent = content;
}

function exportWork() {
  const id = state.currentWorkId;
  if (!id) return;
  const works = DB.getWorks();
  const work = works.find(w => w.id === id);
  if (!work) return;

  const title = work.title || '未命名';
  const content = work.content || '';
  const wordCount = countChars(content);
  const time = formatTimeShort(work.totalWritingTimeMs || 0);

  // Generate Word-compatible HTML
  const htmlContent = content.replace(/\n/g, '<br>').replace(/\s{2}/g, '&nbsp;&nbsp;');
  const html = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'>
<head><meta charset="utf-8"><title>${escapeHtml(title)}</title>
<style>body{font-family:"PingFang SC","Microsoft YaHei",sans-serif;font-size:12pt;line-height:1.8;padding:40px;max-width:600px;margin:0 auto;}
h1{font-size:18pt;text-align:center;margin-bottom:30px;font-weight:600;}
.meta{text-align:center;font-size:9pt;color:#888;margin-bottom:40px;}
p{margin:0 0 8px 0;text-indent:2em;}
</style></head>
<body>
<h1>${escapeHtml(title)}</h1>
<div class="meta">${wordCount} 字 · 写作时长 ${time}</div>
${htmlContent.split('<br>').map(p => '<p>' + p + '</p>').join('\n')}
</body></html>`;

  const blob = new Blob(['﻿' + html], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = title + '.doc';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

// ============================================================
// TIMER
// ============================================================
function startTimer() {
  if (state.timerInterval) return;
  state.timerStartTime = Date.now();
  state.timerInterval = setInterval(() => {
    const elapsed = state.timerAccumulated + (Date.now() - state.timerStartTime);
    document.getElementById('editor-timer').textContent = formatTime(elapsed);
    // Auto-save timer progress every 10 seconds
    if (Math.floor(elapsed / 10000) > Math.floor((elapsed - 1000) / 10000)) {
      // Only update the saved time, don't do a full save every 10s
    }
  }, 1000);
}

function stopTimer() {
  if (!state.timerInterval) return;

  // Save accumulated time + latest content
  if (state.currentWorkId && state.timerStartTime) {
    const works = DB.getWorks();
    const work = works.find(w => w.id === state.currentWorkId);
    if (work) {
      work.totalWritingTimeMs = state.timerAccumulated + (Date.now() - state.timerStartTime);
      work.updatedAt = new Date().toISOString();
      // Save latest content
      const titleEl = document.getElementById('editor-title');
      const contentEl = document.getElementById('editor-content');
      if (titleEl) work.title = titleEl.value.trim() || '未命名';
      if (contentEl) work.content = contentEl.value;
      DB.saveWorks(works);
    }
  }

  clearInterval(state.timerInterval);
  state.timerInterval = null;
  state.timerStartTime = null;
  state.timerAccumulated = 0;
  // Clear any pending save timeout
  if (state.saveTimeout) {
    clearTimeout(state.saveTimeout);
    state.saveTimeout = null;
  }
}

// ============================================================
const AI_DEFAULTS = {
  base: 'https://api.deepseek.com/v1/chat/completions',
  model: 'deepseek-v4-flash',
};

const WriterAI = {
  getConfig() {
    return {
      key: localStorage.getItem('writing_ai_key') || '',
      base: localStorage.getItem('writing_ai_base') || AI_DEFAULTS.base,
      model: localStorage.getItem('writing_ai_model') || AI_DEFAULTS.model,
    };
  },
  saveConfig(cfg) {
    localStorage.setItem('writing_ai_key', (cfg.key || '').trim());
    localStorage.setItem('writing_ai_base', (cfg.base || '').trim() || AI_DEFAULTS.base);
    localStorage.setItem('writing_ai_model', (cfg.model || '').trim() || AI_DEFAULTS.model);
  },
  hasKey() { return !!this.getConfig().key; },

  async chat(messages, timeoutMs) {
    const { key, base, model } = this.getConfig();
    if (!key) throw new Error('还没填 API Key。去底部「我的」页填一下。');

    const ctrl = new AbortController();
    const timer = setTimeout(() => ctrl.abort(), timeoutMs || 60000);
    let res;
    try {
      res = await fetch(base, {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json',
          'Authorization': 'Bearer ' + key,
        },
        body: JSON.stringify({ model, messages, temperature: 0.8, max_tokens: 2048, stream: false }),
        signal: ctrl.signal,
      });
    } catch (err) {
      clearTimeout(timer);
      if (err && err.name === 'AbortError') throw new Error('等太久了，一分钟还没回应。检查一下网络再试。');
      throw new Error('连不上接口。看看网络，或者确认「我的」页里的接口地址没写错。');
    }
    clearTimeout(timer);

    if (!res.ok) {
      let detail = '';
      try {
        const errBody = await res.json();
        if (errBody && errBody.error && errBody.error.message) detail = errBody.error.message;
      } catch (e) {}
      if (res.status === 401 || res.status === 403) throw new Error('API Key 不对，或者没有权限。' + (detail ? '（' + detail + '）' : ''));
      if (res.status === 402) throw new Error('账户余额不足了，去平台上充一点。');
      if (res.status === 429) throw new Error('请求太频繁，缓一会儿再试。');
      if (res.status >= 500) throw new Error('接口那边出错了（' + res.status + '），等会儿再试。');
      throw new Error('请求失败（' + res.status + '）' + (detail ? '：' + detail : ''));
    }

    let data;
    try {
      data = await res.json();
    } catch (e) {
      throw new Error('返回的东西读不懂，接口地址可能填错了。');
    }
    const msg = data && data.choices && data.choices[0] && data.choices[0].message;
    if (!msg || !msg.content) throw new Error('它没返回内容，再试一次。');
    return msg.content;
  },
};

// 太长了就掐中间：保住开头和结尾，短篇的结尾最要紧
function clipText(text, limit) {
  if (text.length <= limit) return text;
  const headLen = Math.floor(limit * 0.6);
  const tailLen = limit - headLen;
  return text.slice(0, headLen) + '\n\n……（中间省略）……\n\n' + text.slice(-tailLen);
}

function buildReviewMessages(mode, fullText, selection, extra) {
  const full = clipText(fullText, 12000);
  let user;
  if (mode === 'selection') {
    user = `我的全文如下，用来了解我的文风，不要动它：
---
${full}
---

我要改的是其中这一段：
---
${clipText(selection, 4000)}
---

只针对这一段谈：放在我整篇的调子里，它哪里偏了、哪里还能更好、有什么方向可以想。再说一次，不要给我改好的句子。`;
  } else {
    user = `我的稿子全文如下：
---
${full}
---

通篇看一遍，说说怎么改。`;
  }
  if (extra && extra.trim()) user += `\n\n另外我还想问：${extra.trim()}`;
  return [
    { role: 'system', content: buildSystemPrompt() },
    { role: 'user', content: user },
  ];
}

// 二次点评：把 fromId 那条往前的整条链重建成真正的 role 交替对话，
// 而不是把上一轮当成纯文本塞进去——这样它是真的在「接着说」。
// 稿子用当前这一版（晞晞选的是「追问看现在的稿子」），所以在末尾要说明稿子改过了。
function buildFollowupMessages(work, fromId, newQuestion, fullText) {
  const byId = new Map((work.analyses || []).map(a => [a.id, a]));
  const chain = [];
  let cur = byId.get(fromId);
  while (cur) {
    chain.unshift(cur);
    cur = cur.parentId ? byId.get(cur.parentId) : null;
  }
  if (!chain.length) return null;

  // root 保留原稿和选段作为基底，中间轮次只带最近 3 段，防止 token 膨胀
  const root = chain[0];
  const tail = chain.slice(1).slice(-3);
  const base = buildReviewMessages(
    root.mode, fullText, root.mode === 'selection' ? root.selection : '', root.question
  );

  const msgs = [
    { role: 'system', content: buildSystemPrompt() },
    base[1],
    { role: 'assistant', content: clipText(root.result, 4000) },
  ];
  for (const a of tail) {
    if (a.question) msgs.push({ role: 'user', content: a.question });
    msgs.push({ role: 'assistant', content: clipText(a.result, 4000) });
  }
  msgs.push({
    role: 'user',
    content: newQuestion.trim() +
      '\n\n（说明：上面那份稿子我后来又改过，你现在看到的就是最新的。' +
      '之前那条点评是对旧版说的，你自己对齐一下。）\n' +
      '再提醒一次：只告诉我问题和方向，不要给我改好的句子。',
  });
  return msgs;
}

// ---------- 极简 Markdown 渲染 ----------
// 整段先转义再做有限替换，AI 输出里的 HTML 永远不会被执行
function renderMarkdown(text) {
  const inline = (s) => s
    .replace(/\*\*([^*\n]+)\*\*/g, '<strong>$1</strong>')
    .replace(/`([^`\n]+)`/g, '<code>$1</code>');

  const lines = escapeHtml(text).split('\n');
  let html = '';
  let inList = false;
  const closeList = () => { if (inList) { html += '</ul>'; inList = false; } };

  for (const rawLine of lines) {
    const line = rawLine.replace(/\s+$/, '');
    if (!line.trim()) { closeList(); continue; }

    let m;
    if ((m = line.match(/^\s*#{1,6}\s+(.*)$/))) {
      closeList();
      html += `<h4>${inline(m[1])}</h4>`;
    } else if ((m = line.match(/^\s*[-*+]\s+(.*)$/))) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(m[1])}</li>`;
    } else if ((m = line.match(/^\s*\d+[.、)]\s+(.*)$/))) {
      if (!inList) { html += '<ul>'; inList = true; }
      html += `<li>${inline(m[1])}</li>`;
    } else if ((m = line.match(/^\s*>\s?(.*)$/))) {
      closeList();
      html += `<blockquote>${inline(m[1])}</blockquote>`;
    } else {
      closeList();
      html += `<p>${inline(line)}</p>`;
    }
  }
  closeList();
  return html;
}

function buildSystemPrompt() {
  const name = polishEditorName();
  return `你叫${name}，是一个写短篇的女编辑，也是她的同行。她写小说，你不写她的句子。

她把自己的稿子拿给你看，你们一起聊怎么改。你比她大几岁，说话直接，不客套，不夸她，也不哄她。

用中文。`;
}
